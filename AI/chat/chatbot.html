<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline ChatGPT Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#212121;
    color:#ECECEC;
    height:100vh;
    overflow:hidden;
}

/* Layout */

.container{
    display:flex;
    height:100vh;
}

/* Sidebar */

.sidebar{
    width:260px;
    background:#171717;
    border-right:1px solid #333;
    display:flex;
    flex-direction:column;
}

.sidebar h2{
    padding:18px;
    font-size:20px;
    border-bottom:1px solid #333;
}

.prompt-list{
    flex:1;
    overflow:auto;
}

.prompt-item{
    padding:14px 18px;
    cursor:pointer;
    border-bottom:1px solid #262626;
    transition:.2s;
}

.prompt-item:hover{
    background:#2d2d2d;
}

/* Main */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
}

/* Chat */

.chat{
    flex:1;
    overflow:auto;
    padding:30px;
}

.message{
    max-width:900px;
    margin:auto;
    margin-bottom:25px;
}

.user{
    text-align:right;
}

.user .bubble{
    display:inline-block;
    background:#0b6ef3;
    color:white;
    padding:14px 18px;
    border-radius:18px;
}

.assistant .bubble{
    display:inline-block;
    background:#2b2b2b;
    color:white;
    padding:18px;
    border-radius:18px;
}

/* Input */

.input-area{
    border-top:1px solid #333;
    padding:20px;
}

.input-box{
    max-width:900px;
    margin:auto;
    display:flex;
    gap:10px;
}

textarea{
    flex:1;
    resize:none;
    height:80px;
    background:#2b2b2b;
    color:white;
    border:none;
    outline:none;
    border-radius:12px;
    padding:15px;
    font-size:15px;
}

button{
    width:120px;
    border:none;
    background:#10a37f;
    color:white;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#0d8c6b;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">

<h2>Prompt Library</h2>

<div class="prompt-list" id="promptList"></div>

</div>

<div class="main">

<div class="chat" id="chat">

<div class="message assistant">
<div class="bubble">
Hello! Select a prompt from the left or type your own message.
</div>
</div>

</div>

<div class="input-area">

<div class="input-box">

<textarea id="promptBox"
placeholder="Type your prompt here..."></textarea>

<button onclick="sendPrompt()">Send</button>

</div>

</div>

</div>

</div>

<script>

/* =====================================================
   CONFIGURATION
   Change only this section.
===================================================== */

const DATA = [

{
title:"Introduction",
prompt:
`Explain what Artificial Intelligence is in simple words.`,

response:
`<h2>Artificial Intelligence</h2>
<p>Artificial Intelligence (AI) enables computers to perform tasks that normally require human intelligence, such as recognizing images, understanding language, and making decisions.</p>`
},

{
title:"Computer Vision",
prompt:
`Explain Computer Vision with examples.`,

response:
`<h2>Computer Vision</h2>
<p>Computer Vision allows computers to understand images and videos. Examples include face recognition, object detection, medical imaging, and self-driving cars.</p>`
},

{
title:"Prompt Engineering",
prompt:
`What is Prompt Engineering?`,

response:
`<h2>Prompt Engineering</h2>
<p>Prompt Engineering is the process of writing clear and effective instructions so that an AI model produces better responses.</p>`
},

{
title:"HTML Game",
prompt:
`Create a simple HTML game.`,

response:
`<h2>HTML Game</h2>
<p>This is a predefined response.</p>
<pre>
Player
↓
Move
↓
Collect Coins
↓
Increase Score
</pre>`
}

];

/* ===================================================== */

const list=document.getElementById("promptList");
const textbox=document.getElementById("promptBox");
const chat=document.getElementById("chat");

let selectedResponse="";

DATA.forEach(item=>{

const div=document.createElement("div");

div.className="prompt-item";

div.innerHTML=item.title;

div.onclick=function(){

textbox.value=item.prompt;

selectedResponse=item.response;

};

list.appendChild(div);

});

function addMessage(text,type,isHTML=false){

const msg=document.createElement("div");

msg.className="message "+type;

const bubble=document.createElement("div");

bubble.className="bubble";

if(isHTML)
bubble.innerHTML=text;
else
bubble.textContent=text;

msg.appendChild(bubble);

chat.appendChild(msg);

chat.scrollTop=chat.scrollHeight;

}

function sendPrompt(){

const prompt=textbox.value.trim();

if(prompt=="") return;

addMessage(prompt,"user");

textbox.value="";

setTimeout(function(){

if(selectedResponse==""){

addMessage(
"I don't have a predefined response configured for this prompt.",
"assistant"
);

}
else{

addMessage(selectedResponse,"assistant",true);

}

},500);

}

textbox.addEventListener("keydown",function(e){

if(e.key==="Enter" && !e.shiftKey){

e.preventDefault();

sendPrompt();

}

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plant Disease Detection</title>

<style>
body{
    font-family:Arial,sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    text-align:center;
}

h2{
    margin-bottom:20px;
}

img{
    max-width:350px;
    max-height:350px;
    margin-top:15px;
    border:1px solid #ccc;
}

button{
    margin-top:15px;
    padding:10px 20px;
    cursor:pointer;
}

#result{
    margin-top:20px;
    text-align:left;
}

.result-item{
    margin:8px 0;
    font-size:18px;
}

canvas{
    display:none;
}
</style>
</head>
<body>

<h2>Plant Disease Detector</h2>

<input type="file" id="imageInput" accept="image/*">

<br>

<img id="preview">

<br>

<button onclick="predict()">
Detect Disease
</button>

<div id="result"></div>

<canvas id="canvas" width="384" height="384"></canvas>

<script type="module">

import * as tflite from "https://esm.sh/@tensorflow/tfjs-tflite";

let model;
let labels = {};

async function loadResources(){

    document.getElementById("result").innerHTML =
        "Loading model...";

    model = await tflite.loadTFLiteModel(
        "./model_float16_quant.tflite"
    );

    labels = await fetch(
        "./class_indices.json"
    ).then(r => r.json());

    document.getElementById("result").innerHTML =
        "Model loaded.";
}

await loadResources();

const imageInput =
document.getElementById("imageInput");

const preview =
document.getElementById("preview");

imageInput.addEventListener("change", e=>{

    const file = e.target.files[0];

    if(!file) return;

    preview.src =
        URL.createObjectURL(file);
});

window.predict = async function(){

    if(!preview.src){
        alert("Select an image first");
        return;
    }

    document.getElementById("result").innerHTML =
        "Analyzing...";

    const canvas =
        document.getElementById("canvas");

    const ctx =
        canvas.getContext("2d");

        ctx.drawImage(preview,0,0,384,384);

    const imageData =
        ctx.getImageData(
            0,
            0,
            384,
            384
        );

    const pixels = imageData.data;

    const input =
        new Float32Array(
            384 * 384 * 3
        );

    let j = 0;

    for(let i=0;i<pixels.length;i+=4){
    input[j++] = pixels[i];
    input[j++] = pixels[i+1];
    input[j++] = pixels[i+2];
    }

    const output =
        model.predict(input);

    const scores =
        Array.from(output.dataSync());

    const ranked =
        scores.map((score,index)=>({
            index,
            score
        }))
        .sort((a,b)=>b.score-a.score)
        .slice(0,5);

    let html =
        "<h3>Top Predictions</h3>";

    ranked.forEach(item=>{

        const label =
            labels[item.index] ||
            ("Class " + item.index);

        html += `
        <div class="result-item">
        ${label}
        :
        ${(item.score*100).toFixed(2)}%
        </div>
        `;
    });

    document.getElementById("result").innerHTML =
        html;
};

</script>

</body>
</html>

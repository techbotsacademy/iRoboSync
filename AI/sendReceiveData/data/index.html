<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>1. Capture Page (Laptop A)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body{ background:#0b0f0e; color:#eaf3ee; font-family:monospace; display:flex; flex-direction:column; align-items:center; padding:20px; }
  .stage{ position:relative; width:min(400px, 90vw); aspect-ratio:4/3; border:1px solid #1f2a26; border-radius:10px; overflow:hidden; background:#000; margin-top:10px; }
  video, canvas.overlay{ position:absolute; top:0; left:0; width:100%; height:100%; transform:scaleX(-1); }
  .preview{ margin-top:15px; width:180px; aspect-ratio:4/3; border:1px solid #4fe3a1; border-radius:6px; background:#000 center/cover no-repeat; }
  .status{ margin:10px 0; color:#7f948b; font-size:14px; text-align:center; }
  #log{ margin-top:15px; width:min(400px, 90vw); border:1px solid #1f2a26; padding:10px; background:#080b0a; font-size:12px; color:#4fe3a1; border-radius:6px; }
  .flash{ position:absolute; inset:0; background:#4fe3a1; opacity:0; transition:opacity .1s; pointer-events:none; }
  .flash.on{ opacity:0.5; }
</style>
</head>
<body>

  <h2>1. Capture Page (Laptop A)</h2>
  <div class="status">Show ✊ <b>FIST</b> to capture photo</div>

  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay" class="overlay"></canvas>
    <div id="flash" class="flash"></div>
  </div>

  <div class="preview" id="preview"></div>
  <div id="log">Status: Initializing...</div>

  <canvas id="grab" style="display:none"></canvas>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const grab = document.getElementById('grab');
const gctx = grab.getContext('2d');
const preview = document.getElementById('preview');
const flashEl = document.getElementById('flash');
const logEl = document.getElementById('log');

function log(msg){ logEl.innerText = 'Status: ' + msg; }

// Function to detect Fist gesture
function checkFist(lm) {
  const wrist = lm[0];
  let curled = 0;
  for (const tipIdx of [8, 12, 16, 20]) {
    if (Math.hypot(lm[tipIdx].x - wrist.x, lm[tipIdx].y - wrist.y) < 0.30) curled++;
  }
  return curled >= 3;
}

let lastCap = 0;
let isUploading = false;

// Function to capture screenshot and upload directly to host ESP32
async function takeScreenshotAndUpload(){
  grab.width = 240; grab.height = 180;
  gctx.save(); gctx.translate(grab.width, 0); gctx.scale(-1, 1);
  gctx.drawImage(video, 0, 0, grab.width, grab.height); gctx.restore();
 
  const dataUrl = grab.toDataURL('image/jpeg', 0.3);
  preview.style.backgroundImage = `url(${dataUrl})`;
 
  flashEl.classList.add('on');
  setTimeout(() => flashEl.classList.remove('on'), 120);

  try {
    isUploading = true;
    log('Uploading photo to ESP32...');
    // Since page is hosted on ESP32 itself, relative path '/upload' works automatically
    const res = await fetch('/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: dataUrl
    });
    if(res.ok) log('Photo Uploaded to ESP32 ✓');
    else log('Upload Failed: ' + res.status);
  } catch(e) {
    log('Network Error: ' + e.message);
  } finally {
    setTimeout(() => { isUploading = false; }, 2500);
  }
}

// Initialize MediaPipe Hands tracking
const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
hands.onResults(results => {
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  octx.clearRect(0, 0, overlay.width, overlay.height);
 
  if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
    const lm = results.multiHandLandmarks[0];
    if (checkFist(lm) && !isUploading && (Date.now() - lastCap > 2500)) {
      lastCap = Date.now();
      takeScreenshotAndUpload();
    }
  }
});

// Start camera feed
const camera = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 400, height: 300 });
camera.start();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>1. Capture Page (Laptop A)</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body{ background:#0b0f0e; color:#eaf3ee; font-family:monospace; display:flex; flex-direction:column; align-items:center; padding:20px; }
  .stage{ position:relative; width:min(400px, 90vw); aspect-ratio:4/3; border:1px solid #1f2a26; border-radius:10px; overflow:hidden; background:#000; margin-top:10px; }
  video, canvas.overlay{ position:absolute; top:0; left:0; width:100%; height:100%; transform:scaleX(-1); }
  .preview{ margin-top:15px; width:180px; aspect-ratio:4/3; border:1px solid #4fe3a1; border-radius:6px; background:#000 center/cover no-repeat; }
  #log{ margin-top:15px; width:min(400px, 90vw); border:1px solid #1f2a26; padding:10px; background:#080b0a; font-size:12px; color:#4fe3a1; border-radius:6px; }
</style>
</head>
<body>

  <h2>1. Capture Page (Laptop A)</h2>
  <div>Show ✊ <b>CLOSED FIST</b> to capture photo</div>

  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay" class="overlay"></canvas>
  </div>

  <div class="preview" id="preview"></div>
  <div id="log">Status: Initializing...</div>

  <canvas id="grab" style="display:none"></canvas>

<!-- Load MediaPipe Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const grab = document.getElementById('grab');
const gctx = grab.getContext('2d');
const preview = document.getElementById('preview');
const logEl = document.getElementById('log');

// Function to update status log on screen
function log(msg){ logEl.innerText = 'Status: ' + msg; }

// Accurate Fist Detection Logic
// Checks if finger tips are folded below their respective PIP joints
function isFist(lm) {
  // Finger Tip vs PIP joint index pairs:
  // Index: tip 8, pip 6 | Middle: tip 12, pip 10 | Ring: tip 16, pip 14 | Pinky: tip 20, pip 18
  const fingerPairs = [[8, 6], [12, 10], [16, 14], [20, 18]];
 
  let foldedFingers = 0;
  for (const [tip, pip] of fingerPairs) {
    // If the finger tip is below the PIP joint (in y-axis), it is folded
    if (lm[tip].y > lm[pip].y) {
      foldedFingers++;
    }
  }

  // Also verify distance from fingertips to wrist to prevent false detections
  const wrist = lm[0];
  let closeToWrist = 0;
  for (const tip of [8, 12, 16, 20]) {
    const distance = Math.hypot(lm[tip].x - wrist.x, lm[tip].y - wrist.y);
    if (distance < 0.28) {
      closeToWrist++;
    }
  }

  // Return true only if all 4 fingers are folded and close to wrist
  return (foldedFingers === 4 && closeToWrist >= 3);
}

let lastCaptureTime = 0;
let isUploading = false;

// Function to take screenshot and send image to ESP32
async function takeScreenshotAndUpload(){
  grab.width = 240;
  grab.height = 180;
 
  // Flip image horizontally so it matches webcam preview
  gctx.save();
  gctx.translate(grab.width, 0);
  gctx.scale(-1, 1);
  gctx.drawImage(video, 0, 0, grab.width, grab.height);
  gctx.restore();
 
  // Convert frame to Base64 JPEG format
  const dataUrl = grab.toDataURL('image/jpeg', 0.3);
  preview.style.backgroundImage = `url(${dataUrl})`;

  try {
    isUploading = true;
    log('Uploading photo to ESP32...');
   
    // POST request to send base64 data to ESP32
    const res = await fetch('/upload', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: dataUrl
    });
   
    if(res.ok) log('Photo Uploaded to ESP32 Successfully ✓');
  } catch(e) {
    log('Upload Error: ' + e.message);
  } finally {
    // Cooldown delay of 3 seconds to avoid multiple accidental captures
    setTimeout(() => { isUploading = false; }, 3000);
  }
}

// Initialize MediaPipe Hands model
const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 1,
  minDetectionConfidence: 0.7, // Higher confidence threshold to reduce random triggers
  minTrackingConfidence: 0.7
});

// Process hand landmarks on every video frame
hands.onResults(results => {
  overlay.width = video.videoWidth;
  overlay.height = video.videoHeight;
  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    const landmarks = results.multiHandLandmarks[0];
   
    // Trigger capture ONLY if a strict fist is detected and cooldown timer has passed
    if (isFist(landmarks) && !isUploading && (Date.now() - lastCaptureTime > 3000)) {
      lastCaptureTime = Date.now();
      takeScreenshotAndUpload();
    }
  }
});

// Start video camera stream
const camera = new Camera(video, {
  onFrame: async () => await hands.send({image: video}),
  width: 400,
  height: 300
});
camera.start();
</script>
</body>
</html>

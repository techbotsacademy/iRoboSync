<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robotic Arm Vision System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            color: #e8eef5;
            background: radial-gradient(circle at 20% 20%, #1b2340 0%, #0a0d1a 55%, #050608 100%);
            padding-bottom: 40px;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 2px;
            font-weight: 600;
            color: #7fdfff;
            text-transform: uppercase;
            padding: 22px 0 6px;
            margin: 0;
            text-shadow: 0 0 18px rgba(127, 223, 255, 0.45);
        }

        .status-bar {
            display: inline-block;
            margin-top: 8px;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: 600;
            color: #5dffb0;
            background: rgba(13, 18, 32, 0.85);
            border: 1px solid rgba(93, 255, 176, 0.35);
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(93, 255, 176, 0.15);
            backdrop-filter: blur(6px);
        }

        .container {
            position: relative;
            display: inline-block;
            width: 1000px;
            height: 700px;
            margin-top: 22px;
            border: 1px solid rgba(127, 223, 255, 0.25);
            border-radius: 24px;
            overflow: hidden;
            background: #02030a;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.03) inset,
                0 25px 60px rgba(0,0,0,0.6),
                0 0 80px rgba(40, 90, 160, 0.18);
        }

        #webcam { display: none; }
        #output_canvas { width: 1000px; height: 700px; display: block; }

        /* Subtle scanline / grid overlay for the "robotic vision" feel */
        .scan-overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(127, 223, 255, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(127, 223, 255, 0.045) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .corner {
            position: absolute;
            width: 34px;
            height: 34px;
            border: 3px solid rgba(127, 223, 255, 0.55);
            z-index: 6;
            pointer-events: none;
        }
        .corner-tl { top: 14px; left: 14px; border-right: none; border-bottom: none; }
        .corner-tr { top: 14px; right: 14px; border-left: none; border-bottom: none; }
        .corner-bl { bottom: 14px; left: 14px; border-right: none; border-top: none; }
        .corner-br { bottom: 14px; right: 14px; border-left: none; border-top: none; }

        .zone {
            position: absolute;
            border: 3px dashed rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: 0.25s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        /* Bigger zones than before */
        #zone-left  { left: 90px;  top: 280px; width: 340px; height: 340px; }
        #zone-right { right: 90px; top: 280px; width: 340px; height: 340px; }

        .active-zone {
            border: 5px solid #00ff7b !important;
            background: rgba(0, 255, 123, 0.16) !important;
            box-shadow: 0 0 55px rgba(0, 255, 123, 0.55), inset 0 0 30px rgba(0, 255, 123, 0.2);
        }

        /* Person uses the same green highlight style as an object,
           but it is a distinct color so you can tell person vs object at a glance */
        .person-zone {
            border: 5px solid #ff5d5d !important;
            background: rgba(255, 93, 93, 0.16) !important;
            box-shadow: 0 0 55px rgba(255, 93, 93, 0.55), inset 0 0 30px rgba(255, 93, 93, 0.2);
        }

        .ai-label {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #00ff7b;
            background: rgba(5, 10, 8, 0.85);
            padding: 8px 16px;
            border-radius: 8px;
            visibility: hidden;
            border: 1px solid #00ff7b;
            text-shadow: 0 0 12px rgba(0, 255, 123, 0.6);
        }

        .person-zone .ai-label {
            color: #ff5d5d;
            border-color: #ff5d5d;
            text-shadow: 0 0 12px rgba(255, 93, 93, 0.6);
        }

        .controls { margin-top: 26px; }

        button {
            padding: 15px 38px;
            font-size: 16px;
            letter-spacing: 0.5px;
            cursor: pointer;
            border-radius: 50px;
            border: none;
            font-weight: 700;
            margin: 6px;
            transition: 0.25s;
            text-transform: uppercase;
        }

        #connectBtn {
            background: linear-gradient(135deg, #ffb347, #ff7e29);
            color: #1a0d00;
            box-shadow: 0 6px 18px rgba(255, 130, 40, 0.35);
        }
        #connectBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(255, 130, 40, 0.5); }

        #startBtn {
            background: linear-gradient(135deg, #34e89e, #0f9b6e);
            color: #02160f;
            box-shadow: 0 6px 18px rgba(15, 155, 110, 0.35);
        }
        #startBtn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(15, 155, 110, 0.5); }

        button:disabled {
            background: #2b2f3a;
            color: #6b7280;
            cursor: not-allowed;
            box-shadow: none;
        }

        .debug-bar {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 22px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #ffd27f;
            background: rgba(13, 18, 32, 0.85);
            border: 1px solid rgba(255, 210, 127, 0.35);
            border-radius: 20px;
            box-shadow: 0 0 18px rgba(255, 210, 127, 0.12);
        }
        .debug-bar span { color: #7fdfff; font-weight: 700; }
    </style>
</head>
<body>

    <h1>Robotic Arm Vision System</h1>
    <div class="status-bar" id="status">1. CONNECT ARDUINO &nbsp;→&nbsp; 2. START CAMERA</div>
    <div class="debug-bar" id="debugBar">
        Last signal sent: <span id="debugSignal">none</span> &nbsp;|&nbsp;
        Person zone (stable): <span id="debugPersonZone">none</span>
    </div>

    <div class="container">
        <video id="webcam" playsinline></video>
        <canvas id="output_canvas" width="1000" height="700"></canvas>

        <div class="scan-overlay"></div>
        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>

        <div id="zone-left" class="zone"><span class="ai-label" id="label-left"></span></div>
        <div id="zone-right" class="zone"><span class="ai-label" id="label-right"></span></div>
    </div>

    <div class="controls">
        <button id="connectBtn">Connect Arduino</button>
        <button id="startBtn" disabled>Start Camera & Voice</button>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('output_canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const connectBtn = document.getElementById('connectBtn');

        const zoneLeftEl = document.getElementById('zone-left');
        const zoneRightEl = document.getElementById('zone-right');

        let net, port, writer;
        let currentL = "", currentR = "";   // object currently in each zone (not counting person)
        let personSideZone = "";            // "left", "right", or "" (person inside a small zone box)
        let isAtHome = true;

        // ---------------- Serial Connection ----------------
        connectBtn.onclick = async () => {
            try {
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: 9600 });
                writer = port.writable.getWriter();
                status.innerText = "Arduino Connected!";
                startBtn.disabled = false;
            } catch (e) { status.innerText = "Error: please reconnect serial."; }
        };

        /*
          COMMAND MEANINGS (must match Arduino code exactly):
            'L' -> Sirf POINT karo LEFT (person ke liye - claw nahi khulta, sirf base ghoomta hai)
            'R' -> Sirf POINT karo RIGHT (person ke liye - claw nahi khulta)
            'P' -> FULL PICK sequence LEFT (object ke liye - base ghoome + shoulder/elbow jhuke + claw band/khule)
            'Q' -> FULL PICK sequence RIGHT (object ke liye - same as 'P' but right side)
            'S' -> STOP / wapas HOME position
        */
        const COMMAND_MEANINGS = {
            'L': 'L (point LEFT - person)',
            'R': 'R (point RIGHT - person)',
            'P': 'P (pick sequence LEFT - object)',
            'Q': 'Q (pick sequence RIGHT - object)',
            'S': 'S (home/stop)'
        };

        async function sendCommand(cmd) {
            // Always update the debug box, even if Arduino isn't connected yet,
            // so you can see exactly what the app WOULD send and when.
            const debugSignalEl = document.getElementById('debugSignal');
            if (debugSignalEl) {
                const time = new Date().toLocaleTimeString();
                debugSignalEl.innerText = (COMMAND_MEANINGS[cmd] || cmd) + " @ " + time;
            }

            if (writer) {
                const data = new TextEncoder().encode(cmd);
                await writer.write(data);
                isAtHome = (cmd === 'S');
            }
        }

        // ---------------- Voice Recognition ----------------
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.lang = 'en-US';
        recognition.interimResults = false;

        recognition.onresult = (event) => {
            const speech = event.results[event.results.length - 1][0].transcript.toLowerCase();
            status.innerText = "I heard: " + speech;

            // ---- "Person" mode: point towards whichever box has the person ----
            // Trigger words: "point", "point out", "find", "where" + "person"
            const personTriggerWords = ["point", "find", "where", "show", "locate"];
            const isPersonCommand = personTriggerWords.some(w => speech.includes(w)) && speech.includes("person");
            if (isPersonCommand) {
                handlePointPerson();
                return;
            }

            // ---- Normal pick/find logic for objects ----
            // "find wheel", "touch wheel", "find spoon" etc. - sab action words yahin handle hote hain.
            // Object mile to FULL PICK sequence chalega (base ghoomega + shoulder/elbow jhukenge +
            // claw khulega -> band hoga -> 2 sec wait -> uthega -> home wapas aayega)
            const actionWords = ["find", "touch", "pick", "get", "grab"];
            const isActionCommand = actionWords.some(w => speech.includes(w));

            const target = matchSpokenTarget(speech);
            if (isActionCommand && target !== "") {
                if (currentL === target) {
                    status.innerText = "Picking up " + target + " (LEFT)";
                    sendCommand('P');   // FULL pick sequence - left
                } else if (currentR === target) {
                    status.innerText = "Picking up " + target + " (RIGHT)";
                    sendCommand('Q');   // FULL pick sequence - right
                } else {
                    status.innerText = target + " not visible in zones!";
                }
            }
        };

        function matchSpokenTarget(speech) {
            const map = {
                "cell phone": ["cell phone", "phone", "mobile"],
                "spoon": ["spoon"],
                "fork": ["fork"],
                "wheel": ["wheel"]
            };
            for (const [label, keywords] of Object.entries(map)) {
                if (keywords.some(k => speech.includes(k))) return label.toUpperCase();
            }
            return "";
        }

        function handlePointPerson() {
            if (personSideZone === "left") {
                status.innerText = "Pointing towards person (left)";
                sendCommand('L');
            } else if (personSideZone === "right") {
                status.innerText = "Pointing towards person (right)";
                sendCommand('R');
            } else {
                status.innerText = "No person detected in zones!";
            }
        }

        // ---------------- AI Model ----------------
        async function loadAI() {
            net = await cocoSsd.load();
            status.innerText = "AI model loaded!";
        }
        loadAI();

        // Bigger zones, matching the new CSS box sizes/positions above.
        const zones = {
            left:  { x: 90,  y: 280, w: 340, h: 340 },
            right: { x: 610, y: 280, w: 340, h: 340 }
        };

        // COCO-SSD does NOT have a "wheel" class. A round wheel gets
        // detected as the closest round shape it knows: donut, frisbee,
        // sports ball, clock, or mouse. We map ONLY those round/wheel-like
        // classes to "WHEEL". Every other object keeps its true, real name
        // (cell phone, spoon, fork, etc.) - no renaming for those.
        const WHEEL_ALIASES = ["donut", "frisbee", "sports ball", "clock", "mouse"];

        function standardLabel(cocoClass) {
            if (WHEEL_ALIASES.includes(cocoClass)) return "WHEEL";
            return cocoClass.toUpperCase();
        }

        // ---- Smoothing/debounce state ----
        // AI confidence flickers frame-to-frame, so a real object/person can briefly
        // drop below the 0.35 threshold for one frame and disappear/reappear.
        // We require a few consecutive "missing" frames before clearing a zone,
        // and we always show the latest "found" result immediately.
        let missCountL = 0;
        let missCountR = 0;
        let personMissCountL = 0;
        let personMissCountR = 0;
        const MISS_TOLERANCE = 4; // ~4 frames of no-detection before we clear the zone

        // These hold the SMOOTHED (debounced) person state - this is what voice
        // commands actually read, NOT the raw per-frame personL/personR.
        let stablePersonL = false;
        let stablePersonR = false;

        async function detectObjects() {
            if (!net || video.readyState !== 4) return;
            const predictions = await net.detect(video, 10, 0.35);

            let foundL = "";   // object label in left zone
            let foundR = "";   // object label in right zone
            let personL = false;
            let personR = false;

            predictions.forEach(p => {
                const scaleX = 1000 / video.videoWidth;
                const scaleY = 700 / video.videoHeight;

                const boxLeftRaw  = p.bbox[0];
                const boxTopRaw   = p.bbox[1];
                const boxW        = p.bbox[2];
                const boxH        = p.bbox[3];

                // Mirror horizontally (matches the single mirrored draw in onFrame).
                const mirroredRight = (video.videoWidth - boxLeftRaw) * scaleX;
                const mirroredLeft  = (video.videoWidth - (boxLeftRaw + boxW)) * scaleX;
                const boxTop    = boxTopRaw * scaleY;
                const boxBottom = (boxTopRaw + boxH) * scaleY;

                // Horizontal center - reliable for left-vs-right because the body's
                // left/right position doesn't change with height the way center-Y does.
                const centerX = (mirroredLeft + mirroredRight) / 2;

                // For small objects, use full bbox center (X and Y).
                const centerY = (boxTop + boxBottom) / 2;
                const centerInLeftZone  = centerX > zones.left.x  && centerX < (zones.left.x  + zones.left.w)  &&
                                           centerY > zones.left.y  && centerY < (zones.left.y  + zones.left.h);
                const centerInRightZone = centerX > zones.right.x && centerX < (zones.right.x + zones.right.w) &&
                                           centerY > zones.right.y && centerY < (zones.right.y + zones.right.h);

                if (p.class === "person") {
                    // PERSON: use horizontal center-X to decide LEFT vs RIGHT (exclusive -
                    // a person can only be in one side, never both), combined with a
                    // vertical check using whether the body overlaps the zone's height band
                    // (a tall standing person's true Y-center sits above the zone boxes,
                    // so we check band-overlap instead of center-Y).
                    const xInLeftZone  = centerX > zones.left.x  && centerX < (zones.left.x  + zones.left.w);
                    const xInRightZone = centerX > zones.right.x && centerX < (zones.right.x + zones.right.w);
                    const yOverlapsZoneBand = boxBottom > zones.left.y && boxTop < (zones.left.y + zones.left.h);

                    if (xInLeftZone && yOverlapsZoneBand)  personL = true;
                    if (xInRightZone && yOverlapsZoneBand) personR = true;
                    return;
                }

                const name = standardLabel(p.class);
                if (centerInLeftZone)  foundL = name;
                if (centerInRightZone) foundR = name;
            });

            // ---- Smoothing for objects (fixes wheel flicker) ----
            // If something is found this frame, show it immediately and reset miss-count.
            // If nothing found this frame, only clear after MISS_TOLERANCE consecutive misses.
            if (foundL !== "") {
                missCountL = 0;
            } else {
                missCountL++;
                if (missCountL < MISS_TOLERANCE) foundL = currentL; // keep showing last known label briefly
                else foundL = "";
            }

            if (foundR !== "") {
                missCountR = 0;
            } else {
                missCountR++;
                if (missCountR < MISS_TOLERANCE) foundR = currentR;
                else foundR = "";
            }

            currentL = foundL;
            currentR = foundR;

            // ---- Smoothing for PERSON (fixes "find person works sometimes, not always") ----
            // THIS is the critical fix: previously personSideZone was set directly from
            // the raw per-frame personL/personR, so if the AI missed the person in the
            // exact single frame when the voice command fired, the command silently did
            // nothing. Now we debounce person detection the same way as objects, so a
            // single missed frame doesn't wipe out the person's known position.
            if (personL) {
                personMissCountL = 0;
                stablePersonL = true;
            } else {
                personMissCountL++;
                if (personMissCountL >= MISS_TOLERANCE) stablePersonL = false;
            }

            if (personR) {
                personMissCountR = 0;
                stablePersonR = true;
            } else {
                personMissCountR++;
                if (personMissCountR >= MISS_TOLERANCE) stablePersonR = false;
            }

            updateZone('left',  foundL, stablePersonL);
            updateZone('right', foundR, stablePersonR);

            // Person side is exclusive: if somehow both are true (rare edge case),
            // treat as ambiguous and clear both to avoid sending a wrong command.
            if (stablePersonL && stablePersonR) {
                personSideZone = ""; // ambiguous - don't move arm on bad data
            } else {
                personSideZone = stablePersonL ? "left" : (stablePersonR ? "right" : "");
            }

            // Live debug display - shows exactly what the voice command will use
            // if "find person" / "point out person" is said right now.
            const debugPersonZoneEl = document.getElementById('debugPersonZone');
            if (debugPersonZoneEl) {
                debugPersonZoneEl.innerText = personSideZone === "" ? "none" : personSideZone.toUpperCase();
            }

            // Auto-home only when truly empty (no object AND no person in either zone)
            const leftEmpty  = foundL === "" && !stablePersonL;
            const rightEmpty = foundR === "" && !stablePersonR;
            if (leftEmpty && rightEmpty && !isAtHome) {
                sendCommand('S');
                status.innerText = "Boxes empty: returning home";
            }
        }

        function updateZone(side, objectLabel, hasPerson) {
            const el  = document.getElementById(`label-${side}`);
            const box = document.getElementById(`zone-${side}`);

            box.classList.remove('active-zone', 'person-zone');

            if (hasPerson) {
                // Person detected inside this zone box -> highlight red, label PERSON
                el.innerText = "PERSON";
                el.style.visibility = "visible";
                box.classList.add('person-zone');
            } else if (objectLabel) {
                // Object detected inside this zone box -> highlight green, real object name
                el.innerText = objectLabel;
                el.style.visibility = "visible";
                box.classList.add('active-zone');
            } else {
                el.style.visibility = "hidden";
            }
        }

        // ---------------- Camera ----------------
        const camera = new Camera(video, {
            onFrame: async () => {
                ctx.save();
                ctx.scale(-1, 1);
                ctx.drawImage(video, -1000, 0, 1000, 700);
                ctx.restore();
                await detectObjects();
            }, width: 1000, height: 700
        });

        startBtn.onclick = () => {
            camera.start();
            recognition.start();
            status.innerText = "System active! Say 'find/touch [object]' to pick, or 'point out person'";
        };
    </script>
</body>
</html>

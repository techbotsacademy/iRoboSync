<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sign Language Detector - Part 1</title>

<style>
body{
    margin:0;
    background:#202124;
    color:white;
    font-family:Arial;
    text-align:center;
}

h1{
    margin:15px;
}

.container{
    position:relative;
    width:640px;
    margin:auto;
}

video{
    width:640px;
    border-radius:10px;
}

canvas{
    position:absolute;
    left:0;
    top:0;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

</head>

<body>

<h1>Sign Language Recognition</h1>

<div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<h2 id="status">Waiting for hand...</h2>
<div id="fingerStatus" style="font-size:22px;margin-top:20px;"></div>

<script>

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const hands=new Hands({
    locateFile:(file)=>{
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands:1,
    modelComplexity:1,
    minDetectionConfidence:0.7,
    minTrackingConfidence:0.7
});

hands.onResults(results => {

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if(results.multiHandLandmarks.length > 0){

        document.getElementById("status").innerHTML = "Hand Detected";

        const landmarks = results.multiHandLandmarks[0];

        drawConnectors(
            ctx,
            landmarks,
            HAND_CONNECTIONS,
            {
                color:"#00FF00",
                lineWidth:4
            }
        );

        drawLandmarks(
            ctx,
            landmarks,
            {
                color:"#FF0000",
                radius:5
            }
        );

        detectFingers(landmarks);

    }
    else{

        document.getElementById("status").innerHTML="Waiting for hand...";
        clearFingerStatus();

    }

});

const camera=new Camera(video,{
    onFrame:async()=>{
        await hands.send({image:video});
    },
    width:640,
    height:480
});

camera.start();
function detectFingers(lm){

    const fingers = {

        thumb  : lm[4].x < lm[3].x,
        index  : lm[8].y < lm[6].y,
        middle : lm[12].y < lm[10].y,
        ring   : lm[16].y < lm[14].y,
        pinky  : lm[20].y < lm[18].y

    };

    document.getElementById("fingerStatus").innerHTML = `

        👍 Thumb : ${fingers.thumb ? "Open" : "Closed"} <br>
        ☝ Index : ${fingers.index ? "Open" : "Closed"} <br>
        🖕 Middle : ${fingers.middle ? "Open" : "Closed"} <br>
        💍 Ring : ${fingers.ring ? "Open" : "Closed"} <br>
        🤏 Pinky : ${fingers.pinky ? "Open" : "Closed"}

    `;

}

function clearFingerStatus(){

    document.getElementById("fingerStatus").innerHTML="";

}

</script>

</body>
</html>

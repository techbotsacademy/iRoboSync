<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HTML Game Generator</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{

    background:#202123;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;

}

header{

    height:65px;
    background:#343541;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid #555;

}

header h2{

    font-weight:500;

}

header button{

    background:#10A37F;
    color:white;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;

}

header button:hover{

    background:#0d8a6d;

}

#chat{

    flex:1;
    overflow-y:auto;
    padding:30px;

}

.message{

    display:flex;
    margin-bottom:25px;

}

.avatar{

    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    margin-right:15px;
    flex-shrink:0;

}

.user .avatar{

    background:#0d8a6d;

}

.bot .avatar{

    background:#555;

}

.bubble{

    background:#343541;
    padding:18px;
    border-radius:12px;
    width:100%;
    line-height:1.6;

}

.user .bubble{

    background:#444654;

}

.code-container{

    margin-top:15px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid #444;

}

.code-header{

    background:#2b2c32;
    padding:10px 15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#ddd;
    font-size:14px;

}

.copy-btn{

    background:#10A37F;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;

}

.copy-btn:hover{

    background:#0d8a6d;

}

pre{

    margin:0 !important;

}

#typing{

    display:none;
    padding:20px;
    color:#aaa;
    font-style:italic;

}

footer{

    background:#343541;
    padding:18px;
    border-top:1px solid #555;

}

.input-row{

    display:flex;
    gap:10px;

}

textarea{

    flex:1;
    resize:none;
    height:60px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:15px;
    font-size:15px;
    background:#40414f;
    color:white;

}

button.send{

    width:120px;
    border:none;
    border-radius:10px;
    background:#10A37F;
    color:white;
    font-size:16px;
    cursor:pointer;

}

button.send:hover{

    background:#0d8a6d;

}

::-webkit-scrollbar{

    width:8px;

}

::-webkit-scrollbar-thumb{

    background:#555;
    border-radius:5px;

}

@media(max-width:700px){

header h2{

    font-size:18px;

}

textarea{

    height:70px;

}

button.send{

    width:90px;

}

}

</style>

</head>
<body>

<header>

<h2>🎮 HTML Game Generator</h2>

<button onclick="clearChat()">
Clear Chat
</button>

</header>

<div id="chat">

<div class="message bot">

<div class="avatar">
AI
</div>

<div class="bubble">

<b>Welcome!</b>

<br><br>

I can generate or modify only these HTML game projects.

<ul style="margin-top:12px; margin-left:25px; line-height:2;">

<li>Fruit Ninja</li>

<li>Mario</li>

<li>Pac-Man</li>

<li>Subway Surfers</li>

<li>MediaPipe Table Tennis</li>

</ul>

<br>

Describe the game you want.

</div>

</div>

</div>

<div id="typing">

Thinking...

</div>

<footer>

<div class="input-row">

<textarea
id="prompt"
placeholder="Describe the HTML game you want..."
></textarea>

<button class="send" onclick="sendPrompt()">
Send
</button>

</div>

</footer>

function clearChat(){

    document.getElementById("chat").innerHTML="";

}

function copyCode(){

</script>

</body>
</html>

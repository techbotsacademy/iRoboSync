<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPU6050 STL Viewer</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #101827; color: #e5e7eb; }
    header { padding: 1rem 1.25rem; border-bottom: 1px solid #263247; }
    h1 { margin: 0; font-size: 1.2rem; }
    main { display: grid; grid-template-columns: minmax(240px, 300px) 1fr; min-height: calc(100vh - 65px); }
    aside { padding: 1rem; border-right: 1px solid #263247; background: #131e31; }
    section { min-height: 500px; position: relative; }
    label, button, input { display: block; width: 100%; }
    label { margin: 1rem 0 .4rem; font-weight: 600; }
    input[type=file] { padding: .55rem; border: 1px solid #3a4a63; border-radius: .4rem; background: #1b293e; }
    button { margin-top: .7rem; padding: .65rem .8rem; border: 0; border-radius: .4rem; color: white; background: #2563eb; cursor: pointer; font-weight: 600; }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .status { margin-top: 1rem; padding: .7rem; border-radius: .4rem; background: #1b293e; color: #b9c7dc; font-size: .9rem; line-height: 1.4; }
    .hint { color: #9caac0; font-size: .82rem; line-height: 1.4; }
    #viewer { width: 100%; height: 100%; min-height: 500px; display: block; }
    .readout { margin-top: 1rem; font-variant-numeric: tabular-nums; color: #dbeafe; }
    @media (max-width: 700px) { main { grid-template-columns: 1fr; } aside { border-right: 0; border-bottom: 1px solid #263247; } }
  </style>
  <!-- The addon modules import "three" by name. This import map tells the
       browser exactly which file that name means on GitHub Pages. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <header><h1>MPU6050 STL Viewer</h1></header>
  <main>
    <aside>
      <label for="stl-file">STL model</label>
      <input id="stl-file" type="file" accept=".stl,model/stl" />
      <p class="hint">A cube is shown by default. Select an STL file to replace it.</p>

      <button id="connect" type="button">Connect ESP32</button>
      <button id="disconnect" type="button" disabled>Disconnect</button>
      <p class="hint">Use Chrome or Edge over HTTPS (or localhost), then choose the ESP32 serial port.</p>
      <div id="status" class="status">Sensor: not connected<br>Model: default cube</div>
      <div id="readout" class="readout">Roll: 0.00°<br>Pitch: 0.00°<br>Yaw: 0.00°</div>
    </aside>
    <section><canvas id="viewer" aria-label="3D model viewer"></canvas></section>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { STLLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/STLLoader.js';
    import { OrbitControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const canvas = document.querySelector('#viewer');
    const fileInput = document.querySelector('#stl-file');
    const connectButton = document.querySelector('#connect');
    const disconnectButton = document.querySelector('#disconnect');
    const status = document.querySelector('#status');
    const readout = document.querySelector('#readout');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x101827);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(3.2, 2.5, 4.5);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 2.2));
    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(4, 6, 5);
    scene.add(keyLight);
    scene.add(new THREE.GridHelper(10, 10, 0x334155, 0x1e293b));

    let model = new THREE.Mesh(
      new THREE.BoxGeometry(2, 2, 2),
      new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: .15, roughness: .55 })
    );
    scene.add(model);
    let roll = 0, pitch = 0, yaw = 0;

    function resize() {
      const width = Math.max(canvas.clientWidth, 1);
      const height = Math.max(canvas.clientHeight, 1);
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    addEventListener('resize', resize);
    resize();

    function modelName() {
      return fileInput.files[0]?.name || 'default cube';
    }

    function setStatus(message) {
      status.innerHTML = message;
    }

    function showModel(geometry, name) {
      geometry.computeVertexNormals();
      geometry.center();
      geometry.computeBoundingSphere();
      const radius = geometry.boundingSphere?.radius || 1;
      const next = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: .15, roughness: .55 })
      );
      next.scale.setScalar(2 / Math.max(radius, .001));
      scene.remove(model);
      model.geometry.dispose();
      model.material.dispose();
      model = next;
      scene.add(model);
      setStatus(`Sensor: ${serialPort ? 'connected' : 'not connected'}<br>Model: ${name}`);
    }

    fileInput.addEventListener('change', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      try {
        showModel(new STLLoader().parse(await file.arrayBuffer()), file.name);
      } catch (error) {
        status.textContent = `Could not read STL: ${error.message}`;
      }
    });

    function updateSensor(values) {
      if (values.length < 3 || values.some(value => !Number.isFinite(value))) return;
      [roll, pitch, yaw] = values;
      model.rotation.set(
        THREE.MathUtils.degToRad(pitch),
        THREE.MathUtils.degToRad(yaw),
        THREE.MathUtils.degToRad(roll),
        'YXZ'
      );
      readout.innerHTML = `Roll: ${roll.toFixed(2)}°<br>Pitch: ${pitch.toFixed(2)}°<br>Yaw: ${yaw.toFixed(2)}°`;
    }

    let serialPort = null;
    let reader = null;
    let keepReading = false;
    let readTask = null;

    async function readSerial() {
      const decoder = new TextDecoderStream();
      const piping = serialPort.readable.pipeTo(decoder.writable).catch(() => {});
      reader = decoder.readable.getReader();
      let buffer = '';
      try {
        while (keepReading) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split(/\r?\n/);
          buffer = lines.pop() || '';
          for (const line of lines) {
            const values = line.split(',').map(value => Number.parseFloat(value.trim()));
            updateSensor(values);
          }
        }
      } catch (error) {
        if (keepReading) status.textContent = `Serial error: ${error.message}`;
      } finally {
        reader?.releaseLock();
        reader = null;
        await piping;
      }
    }

    connectButton.addEventListener('click', async () => {
      if (!('serial' in navigator)) {
        status.textContent = 'Web Serial is not supported. Use Chrome or Edge.';
        return;
      }
      try {
        serialPort = await navigator.serial.requestPort();
        await serialPort.open({ baudRate: 115200 });
        keepReading = true;
        connectButton.disabled = true;
        disconnectButton.disabled = false;
        setStatus(`Sensor: connected<br>Model: ${modelName()}`);
        readTask = readSerial();
      } catch (error) {
        serialPort = null;
        status.textContent = `Connection cancelled or failed: ${error.message}`;
      }
    });

    disconnectButton.addEventListener('click', async () => {
      keepReading = false;
      await reader?.cancel();
      await readTask?.catch(() => {});
      if (serialPort) await serialPort.close();
      serialPort = null;
      readTask = null;
      connectButton.disabled = false;
      disconnectButton.disabled = true;
      setStatus(`Sensor: not connected<br>Model: ${modelName()}`);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>

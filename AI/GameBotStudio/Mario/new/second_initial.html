<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Mario Platformer</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}
canvas{
    display:block;
    margin:auto;
    background:#87CEEB;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const gravity=0.7;
const moveSpeed=4;
const jumpPower=-13;

const start={x:50,y:350};

const player={
    x:start.x,
    y:start.y,
    w:30,
    h:40,
    vx:0,
    vy:0,
    grounded:false
};

const keys={};

/*==================================================
    SCORE
==================================================*/
let score=0;

/*==================================================
    PLATFORMS
==================================================*/
const platforms=[
    {x:0,y:450,w:900,h:50},
    {x:150,y:360,w:120,h:20},
    {x:330,y:300,w:120,h:20},
    {x:520,y:240,w:120,h:20},
    {x:700,y:170,w:120,h:20}
];

/*==================================================
    COINS
==================================================*/
const coins=[
    {x:185,y:330,r:8,collected:false},
    {x:365,y:270,r:8,collected:false},
    {x:555,y:210,r:8,collected:false},
    {x:735,y:140,r:8,collected:false},
    {x:860,y:420,r:8,collected:false}
];

/*==================================================
    GOAL
==================================================*/
const goal={
    x:820,
    y:110,
    w:12,
    h:60
};

/*==================================================
    INPUT
==================================================*/
document.addEventListener("keydown",e=>{
    keys[e.code]=true;

    if((e.code==="Space"||e.code==="ArrowUp")&&player.grounded){
        player.vy=jumpPower;
        player.grounded=false;
    }
});

document.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

/*==================================================
    RESET
==================================================*/
function resetGame(){

    player.x=start.x;
    player.y=start.y;
    player.vx=0;
    player.vy=0;

    score=0;

    coins.forEach(c=>{
        c.collected=false;
    });
}

/*==================================================
    UPDATE
==================================================*/
function update(){

    player.vx=0;

    if(keys["ArrowLeft"]||keys["KeyA"])
        player.vx=-moveSpeed;

    if(keys["ArrowRight"]||keys["KeyD"])
        player.vx=moveSpeed;

    player.vy+=gravity;

    player.x+=player.vx;
    player.y+=player.vy;

    player.grounded=false;

    for(const p of platforms){

        if(
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>=p.y &&
            player.y+player.h-player.vy<=p.y
        ){
            player.y=p.y-player.h;
            player.vy=0;
            player.grounded=true;
        }
    }

    /*==============================
        COIN COLLECTION
    ==============================*/
    for(const coin of coins){

        if(coin.collected) continue;

        const nearestX=Math.max(
            player.x,
            Math.min(coin.x,player.x+player.w)
        );

        const nearestY=Math.max(
            player.y,
            Math.min(coin.y,player.y+player.h)
        );

        const dx=coin.x-nearestX;
        const dy=coin.y-nearestY;

        if(dx*dx+dy*dy<coin.r*coin.r){
            coin.collected=true;
            score++;
        }
    }

    if(player.y>canvas.height+100){
        resetGame();
    }

    if(
        player.x<goal.x+goal.w &&
        player.x+player.w>goal.x &&
        player.y<goal.y+goal.h &&
        player.y+player.h>goal.y
    ){
        alert("You Win!");
        resetGame();
    }
}

/*==================================================
    BACKGROUND
==================================================*/

function drawMountains(){

    ctx.fillStyle="#8A8A8A";

    ctx.beginPath();
    ctx.moveTo(0,450);
    ctx.lineTo(120,220);
    ctx.lineTo(240,450);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(180,450);
    ctx.lineTo(360,170);
    ctx.lineTo(540,450);
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(450,450);
    ctx.lineTo(700,180);
    ctx.lineTo(900,450);
    ctx.fill();
}

function drawCloud(x,y){

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(x,y,20,0,Math.PI*2);
    ctx.arc(x+20,y-10,18,0,Math.PI*2);
    ctx.arc(x+45,y,20,0,Math.PI*2);
    ctx.arc(x+20,y+8,22,0,Math.PI*2);
    ctx.fill();
}

function drawBush(x,y){

    ctx.fillStyle="#2E8B57";

    ctx.beginPath();
    ctx.arc(x,y,18,0,Math.PI*2);
    ctx.arc(x+20,y-8,18,0,Math.PI*2);
    ctx.arc(x+40,y,18,0,Math.PI*2);
    ctx.fill();
}

function drawTree(x,y){

    ctx.fillStyle="#7B4A12";
    ctx.fillRect(x+12,y,12,40);

    ctx.fillStyle="#228B22";

    ctx.beginPath();
    ctx.arc(x+18,y-10,24,0,Math.PI*2);
    ctx.fill();
}

function drawCoins(){

    ctx.fillStyle="gold";

    for(const coin of coins){

        if(coin.collected) continue;

        ctx.beginPath();
        ctx.arc(coin.x,coin.y,coin.r,0,Math.PI*2);
        ctx.fill();

        ctx.strokeStyle="#C98A00";
        ctx.stroke();
    }
}

function drawScore(){

    ctx.fillStyle="black";
    ctx.font="24px Arial";
    ctx.fillText("Score: "+score,20,35);
}

/*==================================================
    DRAW
==================================================*/
function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    /* Part 2 will finish this draw() function by
       rendering the background, platforms, coins,
       goal, player, and score in the proper order. */

}

/*==================================================
    GAME LOOP
==================================================*/
function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();

</script>

</body>
</html>

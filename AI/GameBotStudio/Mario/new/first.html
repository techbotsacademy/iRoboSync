<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Mario Platformer</title>
<style>
html,body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}
canvas{
    display:block;
    margin:auto;
    background:#87CEEB;
}
</style>
</head>
<body>

<canvas id="game" width="900" height="500"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const gravity = 0.7;
const moveSpeed = 4;
const jumpPower = -13;

const start = {x:50,y:350};

const player = {
    x:start.x,
    y:start.y,
    w:30,
    h:40,
    vx:0,
    vy:0,
    grounded:false
};

const keys = {};

const platforms = [
    {x:0,y:450,w:900,h:50},
    {x:150,y:360,w:120,h:20},
    {x:330,y:300,w:120,h:20},
    {x:520,y:240,w:120,h:20},
    {x:700,y:170,w:120,h:20}
];

const goal = {
    x:820,
    y:110,
    w:12,
    h:60
};

document.addEventListener("keydown",e=>{
    keys[e.code]=true;

    if((e.code==="Space" || e.code==="ArrowUp") && player.grounded){
        player.vy=jumpPower;
        player.grounded=false;
    }
});

document.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

function resetGame(){
    player.x=start.x;
    player.y=start.y;
    player.vx=0;
    player.vy=0;
}

function update(){

    player.vx=0;

    if(keys["ArrowLeft"] || keys["KeyA"])
        player.vx=-moveSpeed;

    if(keys["ArrowRight"] || keys["KeyD"])
        player.vx=moveSpeed;

    player.vy+=gravity;

    player.x+=player.vx;
    player.y+=player.vy;

    player.grounded=false;

    for(const p of platforms){

        if(
            player.x+player.w>p.x &&
            player.x<p.x+p.w &&
            player.y+player.h>=p.y &&
            player.y+player.h-player.vy<=p.y
        ){
            player.y=p.y-player.h;
            player.vy=0;
            player.grounded=true;
        }
    }

    if(player.y>canvas.height+100){
        resetGame();
    }

    if(
        player.x<goal.x+goal.w &&
        player.x+player.w>goal.x &&
        player.y<goal.y+goal.h &&
        player.y+player.h>goal.y
    ){
        alert("You Win!");
        resetGame();
    }
}

function draw(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Platforms
    ctx.fillStyle="#5E8C31";
    for(const p of platforms){
        ctx.fillRect(p.x,p.y,p.w,p.h);
    }

    // Goal flag pole
    ctx.fillStyle="#555";
    ctx.fillRect(goal.x,goal.y,goal.w,goal.h);

    // Flag
    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.moveTo(goal.x+goal.w,goal.y);
    ctx.lineTo(goal.x+goal.w+30,goal.y+10);
    ctx.lineTo(goal.x+goal.w,goal.y+20);
    ctx.closePath();
    ctx.fill();

    // Player
    ctx.fillStyle="#ff4444";
    ctx.fillRect(player.x,player.y,player.w,player.h);

    // Head
    ctx.fillStyle="#FFD39B";
    ctx.beginPath();
    ctx.arc(player.x+15,player.y+10,8,0,Math.PI*2);
    ctx.fill();
}

function loop(){
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>

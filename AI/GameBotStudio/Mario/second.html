<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Game - Canvas Generated Graphics</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            color: white;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            margin-bottom: 10px;
        }

        canvas {
            background-color: #5c94fc; 
            border: 4px solid #ffffff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        p {
            margin-top: 10px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <h1>My First Platformer</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <p>Controls: A/D or Left/Right Arrows to Move | Spacebar or Up Arrow to Jump</p>

    <script>
        // --- 1. SETUP GAME CANVAS ---
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // --- 2. GAME VARIABLES & PHYSICS ---
        const gravity = 0.5; 
        const friction = 0.8; 
        let score = 0;

        const keys = { right: false, left: false, up: false };

        // --- 3. PLAYER OBJECT ---
        const player = {
            x: 50,
            y: 400,
            width: 32,
            height: 48, 
            velocityX: 0,
            velocityY: 0,
            speed: 5,
            jumpForce: 12,
            grounded: false,
            facingRight: true,
            animFrame: 0,
            animTimer: 0
        };

        // --- 4. PLATFORMS & PIPES ARRAY ---
        const platforms = [
            { x: 0, y: 550, width: 800, height: 50, type: 'ground' },
            { x: 150, y: 430, width: 150, height: 32, type: 'brick' },
            { x: 450, y: 350, width: 192, height: 32, type: 'brick' }, 
            { x: 200, y: 240, width: 160, height: 32, type: 'brick' },
            { x: 680, y: 430, width: 64, height: 120, type: 'pipe' }
        ];

        // --- 5. COINS ARRAY ---
        const coins = [
            { x: 215, y: 380, width: 20, height: 26, collected: false, sparkleTimer: 0, animFrame: 0 },
            { x: 545, y: 300, width: 20, height: 26, collected: false, sparkleTimer: 0, animFrame: 0 },
            { x: 275, y: 190, width: 20, height: 26, collected: false, sparkleTimer: 0, animFrame: 0 }
        ];

        // --- 6. EVENT LISTENERS ---
        window.addEventListener("keydown", function (e) {
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = true;
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = true;
            if (e.key === "ArrowUp" || e.key === " " || e.key === "Spacebar") keys.up = true;
        });

        window.addEventListener("keyup", function (e) {
            if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keys.right = false;
            if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keys.left = false;
            if (e.key === "ArrowUp" || e.key === " " || e.key === "Spacebar") keys.up = false;
        });

        // --- 7. COLLISION DETECTION ---
        function checkCollision(objA, objB) {
            return objA.x < objB.x + objB.width &&
                   objA.x + objA.width > objB.x &&
                   objA.y < objB.y + objB.height &&
                   objA.y + objA.height > objB.y;
        }

        // --- 8. PROCEDURAL BACKGROUND GENERATION FUNCTIONS ---
        function drawSkyBackground() {
            // Draw Blue Sky Gradient
            let skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, "#5c94fc");
            skyGrad.addColorStop(1, "#b8d0fc");
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Far Mountains
            drawMountain(100, 550, 250, 300, "#4d88e0");
            drawMountain(400, 550, 300, 350, "#417cd4");

            // Rolling Hills
            drawHill(0, 550, 160, 80, "#4cb050");
            drawHill(250, 550, 220, 110, "#3e9c42");
            drawHill(550, 550, 180, 90, "#4cb050");

            // Clouds
            drawCloud(120, 120, 40);
            drawCloud(500, 80, 50);
            drawCloud(700, 150, 35);

            // Bushes & Small Trees
            drawBush(80, 530, 25, "#2e7d32");
            drawBush(380, 530, 30, "#2e7d32");
            drawTree(600, 480);
        }

        function drawMountain(x, y, width, height, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineTo(x + width / 2, y - height);
            ctx.lineTo(x + width, y);
            ctx.closePath();
            ctx.fill();
            // Mountain Peak Highlight
            ctx.fillStyle = "rgba(255,255,255,0.4)";
            ctx.beginPath();
            ctx.moveTo(x + width / 2 - width * 0.08, y - height * 0.84);
            ctx.lineTo(x + width / 2, y - height);
            ctx.lineTo(x + width / 2 + width * 0.08, y - height * 0.84);
            ctx.closePath();
            ctx.fill();
        }

        function drawHill(x, y, radiusX, radiusY, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.ellipse(x + radiusX, y, radiusX, radiusY, 0, Math.PI, 0);
            ctx.fill();
        }

        function drawCloud(x, y, r) {
            ctx.fillStyle = "#ffffff";
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.arc(x + r * 0.6, y - r * 0.4, r * 0.8, 0, Math.PI * 2);
            ctx.arc(x + r * 1.3, y, r * 0.6, 0, Math.PI * 2);
            ctx.arc(x + r * 0.7, y + r * 0.2, r * 0.7, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawBush(x, y, r, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.arc(x + r * 0.7, y - r * 0.2, r * 0.9, 0, Math.PI * 2);
            ctx.arc(x + r * 1.4, y, r * 0.7, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }

        function drawTree(x, y) {
            // Trunk
            ctx.fillStyle = "#795548";
            ctx.fillRect(x + 15, y, 14, 70);
            // Foliage
            ctx.fillStyle = "#2e7d32";
            ctx.beginPath();
            ctx.arc(x + 22, y, 30, 0, Math.PI * 2);
            ctx.arc(x + 22, y - 25, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        // --- 9. CHARACTER DRAWING FUNCTION ---
        function drawProceduralPlayer(p) {
            ctx.save();
            ctx.translate(p.x + p.width / 2, p.y + p.height / 2);
            
            if (!p.facingRight) {
                ctx.scale(-1, 1);
            }

            // Simple running leg animation offsets
            let legOffsetLeft = 0;
            let legOffsetRight = 0;
            if (!p.grounded) {
                legOffsetLeft = -8;
                legOffsetRight = 6;
            } else if (Math.abs(p.velocityX) > 0.2) {
                legOffsetLeft = Math.sin(p.animFrame * 1.5) * 6;
                legOffsetRight = -Math.sin(p.animFrame * 1.5) * 6;
            }

            // 1. Shoes
            ctx.fillStyle = "#4e342e";
            ctx.fillRect(-14 + legOffsetLeft, 16, 11, 8); // Left Shoe
            ctx.fillRect(3 + legOffsetRight, 16, 11, 8);  // Right Shoe

            // 2. Legs & Overalls Lower
            ctx.fillStyle = "#0d47a1";
            ctx.fillRect(-12 + legOffsetLeft, 6, 8, 11); // Left Blue Leg
            ctx.fillRect(4 + legOffsetRight, 6, 8, 11);  // Right Blue Leg
            ctx.fillRect(-10, -4, 20, 11); // Overalls Waist

            // 3. Torso (Red Shirt & Blue Straps)
            ctx.fillStyle = "#d32f2f";
            ctx.fillRect(-11, -14, 22, 10); // Red Body Shirt
            ctx.fillStyle = "#0d47a1";
            ctx.fillRect(-8, -14, 4, 10);  // Left Overalls Strap
            ctx.fillRect(4, -14, 4, 10);   // Right Overalls Strap
            // Yellow Buttons
            ctx.fillStyle = "#fbc02d";
            ctx.fillRect(-8, -8, 3, 3);
            ctx.fillRect(5, -8, 3, 3);

            // 4. Arms & White Gloves
            ctx.fillStyle = "#d32f2f";
            ctx.fillRect(-15, -14, 5, 12); // Left Sleeve
            ctx.fillRect(10, -14, 5, 12);  // Right Sleeve
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(-16, -4, 6, 6);   // Left Glove
            ctx.fillRect(10, -4, 6, 6);    // Right Glove

            // 5. Face & Nose
            ctx.fillStyle = "#ffccbc";
            ctx.fillRect(-8, -26, 16, 13); // Main Face Block
            ctx.fillRect(4, -22, 6, 5);    // Nose protrusion

            // 6. Eyes & Moustache
            ctx.fillStyle = "#000000";
            ctx.fillRect(3, -24, 3, 4); // Eye
            ctx.fillStyle = "#2d1a12";
            ctx.fillRect(1, -18, 9, 3);  // Moustache

            // 7. Red Cap
            ctx.fillStyle = "#d32f2f";
            ctx.fillRect(-9, -30, 17, 5); // Main Cap Box
            ctx.fillRect(-3, -29, 13, 4);
            ctx.fillRect(2, -27, 10, 2);  // Cap Visor/Brim

            ctx.restore();
        }

        // --- 10. THE MAIN GAME LOOP ---
        function gameLoop() {
            // Player Movement Update
            if (keys.right) {
                player.velocityX = player.speed;
                player.facingRight = true;
                if (player.grounded) {
                    player.animTimer++;
                    if (player.animTimer > 4) {
                        player.animFrame++;
                        player.animTimer = 0;
                    }
                }
            } else if (keys.left) {
                player.velocityX = -player.speed;
                player.facingRight = false;
                if (player.grounded) {
                    player.animTimer++;
                    if (player.animTimer > 4) {
                        player.animFrame++;
                        player.animTimer = 0;
                    }
                }
            } else {
                player.velocityX *= friction;
                if (player.grounded && Math.abs(player.velocityX) < 0.2) {
                    player.animFrame = 0;
                }
            }

            if (keys.up && player.grounded) {
                player.velocityY = -player.jumpForce;
                player.grounded = false;
            }

            player.velocityY += gravity;
            player.x += player.velocityX;
            
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            player.y += player.velocityY;
            player.grounded = false; 

            // Platforms & Pipes Collision Processing
            for (let i = 0; i < platforms.length; i++) {
                let plat = platforms[i];
                if (checkCollision(player, plat)) {
                    if (player.velocityY > 0 && (player.y + player.height - player.velocityY) <= plat.y) {
                        player.y = plat.y - player.height; 
                        player.velocityY = 0;             
                        player.grounded = true;           
                    }
                    else if (player.velocityY < 0 && (player.y - player.velocityY) >= plat.y + plat.height) {
                        player.y = plat.y + plat.height;   
                        player.velocityY = 0;             
                    }
                    else if (player.velocityX > 0 && (player.x + player.width - player.velocityX) <= plat.x) {
                        player.x = plat.x - player.width;
                    }
                    else if (player.velocityX < 0 && (player.x - player.velocityX) >= plat.x + plat.width) {
                        player.x = plat.x + plat.width;
                    }
                }
            }

            // Coin Processing & Animation Setup
            for (let i = 0; i < coins.length; i++) {
                let coin = coins[i];
                
                // Advance standard spin frames loop tracker
                coin.animFrame = (coin.animFrame + 1) % 40;

                if (!coin.collected) {
                    if (checkCollision(player, coin)) {
                        coin.collected = true;
                        score += 100;
                    }
                } else if (coin.collected && coin.sparkleTimer < 20) {
                    coin.sparkleTimer++;
                }
            }

            // --- PROCEDURAL RENDERING ENGINE LAYER ---
            
            // 1. Draw Background World Scene
            drawSkyBackground();

            // 2. Render Canvas UI Score Elements
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 20px 'Courier New', monospace";
            ctx.fillText(`MARIO   SCORE: ${String(score).padStart(6, '0')}`, 30, 40);

            // 3. Render Custom Platforms & Pipe Elements
            for (let i = 0; i < platforms.length; i++) {
                let plat = platforms[i];

                if (plat.type === 'ground') {
                    // Draw Grass Topped Earth Block Layer
                    ctx.fillStyle = "#4caf50";
                    ctx.fillRect(plat.x, plat.y, plat.width, 14); // Green Grass Blade top bar
                    ctx.fillStyle = "#388e3c";
                    ctx.fillRect(plat.x, plat.y + 11, plat.width, 4);  // Grass Under-Shadow
                    ctx.fillStyle = "#8d6e63";
                    ctx.fillRect(plat.x, plat.y + 15, plat.width, plat.height - 15); // Dirt Foundation Core

                    // Dirt Texturing details
                    ctx.fillStyle = "#5d4037";
                    for (let dx = plat.x + 8; dx < plat.x + plat.width; dx += 32) {
                        ctx.fillRect(dx, plat.y + 24, 6, 6);
                        ctx.fillRect(dx + 14, plat.y + 36, 6, 6);
                    }
                } 
                else if (plat.type === 'brick') {
                    // Shaded Retro Brick Platform Rendering System
                    ctx.fillStyle = "#b0bec5";
                    ctx.fillStyle = "#d84315"; // Base Terracotta Brick Color
                    ctx.fillRect(plat.x, plat.y, plat.width, plat.height);

                    ctx.strokeStyle = "#4e1505"; // Deep grout separation line borders
                    ctx.lineWidth = 2;
                    ctx.strokeRect(plat.x, plat.y, plat.width, plat.height);

                    // Row & column slicing computations for individual brick highlights
                    let brickW = 32;
                    let brickH = 16;
                    ctx.beginPath();
                    // Horizontal separator seam line
                    ctx.moveTo(plat.x, plat.y + brickH);
                    ctx.lineTo(plat.x + plat.width, plat.y + brickH);

                    // Vertical staggered joints array placement maps
                    for (let bx = plat.x; bx <= plat.x + plat.width; bx += brickW) {
                        ctx.moveTo(bx, plat.y);
                        ctx.lineTo(bx, plat.y + brickH);
                        ctx.moveTo(bx + brickW / 2, plat.y + brickH);
                        ctx.lineTo(bx + brickW / 2, plat.y + plat.height);
                    }
                    ctx.stroke();

                    // Subtle highlights for depth
                    ctx.fillStyle = "rgba(255,255,255,0.25)";
                    for (let bx = plat.x; bx < plat.x + plat.width; bx += brickW) {
                        ctx.fillRect(bx + 2, plat.y + 2, brickW - 4, 2);
                        ctx.fillRect(bx + brickW/2 + 2, plat.y + brickH + 2, brickW - 4, 2);
                    }
                } 
                else if (plat.type === 'pipe') {
                    // Traditional Shaded Classic Warp Pipe Construct
                    let rimHeight = 28;
                    
                    // Main Long Lower Body Section Tube
                    let bodyGrad = ctx.createLinearGradient(plat.x, plat.y, plat.x + plat.width, plat.y);
                    bodyGrad.addColorStop(0, "#1b5e20");
                    bodyGrad.addColorStop(0.3, "#4caf50");
                    bodyGrad.addColorStop(0.7, "#a5d6a7");
                    bodyGrad.addColorStop(1, "#1b5e20");
                    
                    ctx.fillStyle = bodyGrad;
                    ctx.fillRect(plat.x + 4, plat.y + rimHeight, plat.width - 8, plat.height - rimHeight);
                    ctx.strokeStyle = "#0d230d";
                    ctx.lineWidth = 3;
                    ctx.strokeRect(plat.x + 4, plat.y + rimHeight, plat.width - 8, plat.height - rimHeight);

                    // Upper Overhanging Collar Rim Cap Struct
                    let rimGrad = ctx.createLinearGradient(plat.x, plat.y, plat.x + plat.width, plat.y);
                    rimGrad.addColorStop(0, "#1b5e20");
                    rimGrad.addColorStop(0.2, "#4caf50");
                    rimGrad.addColorStop(0.6, "#a5d6a7");
                    rimGrad.addColorStop(1, "#1b5e20");

                    ctx.fillStyle = rimGrad;
                    ctx.fillRect(plat.x, plat.y, plat.width, rimHeight);
                    ctx.strokeRect(plat.x, plat.y, plat.width, rimHeight);
                }
            }

            // 4. Render Shiny Procedural Gradients Coins & Sparkles
            for (let i = 0; i < coins.length; i++) {
                let coin = coins[i];
                if (!coin.collected) {
                    ctx.save();
                    ctx.translate(coin.x + coin.width / 2, coin.y + coin.height / 2);

                    // Calculate spinning width scale using cosine over animation frame cycles
                    let widthScale = Math.abs(Math.cos(coin.animFrame * 0.16));
                    if (widthScale < 0.1) widthScale = 0.1; // Prevent complete inversion flat invisible state
                    ctx.scale(widthScale, 1);

                    // Bright Golden Metallic Shaded Ring Gradient Fill Path
                    let goldGrad = ctx.createRadialGradient(-2, -2, 2, 0, 0, coin.width / 2);
                    goldGrad.addColorStop(0, "#fffde7");
                    goldGrad.addColorStop(0.4, "#fbc02d");
                    goldGrad.addColorStop(1, "#f57f17");

                    ctx.fillStyle = goldGrad;
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.width / 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = "#e65100";
                    ctx.lineWidth = 1.5;
                    ctx.stroke();

                    // Inner Emblem Core Design Rib
                    ctx.beginPath();
                    ctx.arc(0, 0, coin.width / 4, 0, Math.PI * 2);
                    ctx.strokeStyle = "#f57f17";
                    ctx.stroke();

                    ctx.restore();
                } else if (coin.collected && coin.sparkleTimer < 20) {
                    // Floating Procedural Sparkle Blast Feedback Mechanics
                    ctx.save();
                    ctx.translate(coin.x + coin.width / 2, coin.y - 10);
                    ctx.fillStyle = `rgba(255, 235, 59, ${(20 - coin.sparkleTimer) / 20})`;
                    
                    // Simple four-point pixel star burst drawing block
                    for (let r = 0; r < 4; r++) {
                        ctx.rotate(Math.PI / 2);
                        ctx.beginPath();
                        ctx.moveTo(0, -4 - coin.sparkleTimer * 0.6);
                        ctx.lineTo(3, 0);
                        ctx.lineTo(0, 4 + coin.sparkleTimer * 0.6);
                        ctx.lineTo(-3, 0);
                        ctx.closePath();
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            // 5. Draw Mario Player Model
            drawProceduralPlayer(player);

            requestAnimationFrame(gameLoop);
        }

        // Start running immediately!
        gameLoop();
    </script>
</body>
</html>

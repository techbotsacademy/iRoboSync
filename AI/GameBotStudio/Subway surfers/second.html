<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers Lite - Enhanced</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 400px;
            height: 600px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            border-radius: 16px;
            overflow: hidden;
            border: 4px solid #333;
        }
        canvas {
            display: block;
            background: linear-gradient(to bottom, #74b9ff 0%, #a29bfe 45%, #6c5ce7 50%, #2ed573 50%, #26af5a 100%);
        }
        /* UI Layers */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            padding: 20px;
        }
        .hud-element {
            font-size: 20px;
            font-weight: 900;
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
            letter-spacing: 1px;
        }
        #score-board { color: #ffd700; }
        #coin-board { color: #fffa65; }

        /* Overlay Menus */
        .menu-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            padding: 30px;
            text-align: center;
        }
        .menu-screen.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        h1 {
            color: #ff4757;
            font-size: 42px;
            margin-bottom: 5px;
            font-weight: 900;
            text-shadow: 3px 3px 0px #fff;
            letter-spacing: -1px;
        }
        .instructions {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 12px;
            margin: 20px 0;
            font-size: 15px;
            line-height: 1.6;
            color: #dfe4ea;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .instructionsstrong { color: #fffa65; }
        
        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #ced6e0;
        }
        
        button {
            padding: 14px 40px;
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(to bottom, #ffea00, #ff9f43);
            color: #000;
            border: 3px solid #fff;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 0 #d35400;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:hover {
            background: linear-gradient(to bottom, #fff200, #ffb142);
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #d35400;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #d35400;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        
        <div class="ui-layer">
            <div id="score-board" class="hud-element">SCORE: 0</div>
            <div id="coin-board" class="hud-element">🪙 0</div>
        </div>

        <div id="start-screen" class="menu-screen active">
            <h1>SUBWAY RUNNER</h1>
            <p>Endless 3D Cartoon Dash</p>
            <div class="instructions">
                <strong>← / → Keys</strong> : Switch Lanes smoothly<br>
                <strong>↑ Arrow Key</strong> : Jump over low obstacles<br>
                <strong>Collect Coins</strong> : Boosts your final score!
            </div>
            <button onclick="setupAndStart()">START RUN</button>
        </div>

        <div id="game-over-screen" class="menu-screen">
            <h1>CRASHED!</h1>
            <p id="final-score-text">Final Score: 0</p>
            <p id="final-coins-text" style="color: #fffa65; font-weight: bold; margin-top: -15px;">Coins: 0</p>
            <button onclick="setupAndStart()">RESTART MATCH</button>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreBoard = document.getElementById('score-board');
    const coinBoard = document.getElementById('coin-board');
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const finalScoreText = document.getElementById('final-score-text');
    const finalCoinsText = document.getElementById('final-coins-text');

    // Audio Engine context setup dynamically on interactions
    let audioCtx = null;

    // Game Constants
    const LANES = [-1, 0, 1]; 
    const HORIZON_Y = 260;     // Adjusted lower skyline for cleaner 3D depth
    const TRACK_BASE_WIDTH = 480; 
    const GRAVITY = 0.55;

    // Game Variables
    let gameActive = false;
    let score = 0;
    let coinsCollected = 0;
    let speed = 5; 
    const maxSpeed = 14;

    // Entities
    let player = {
        currentLaneIndex: 1, 
        targetLaneIndex: 1,
        laneX: 0,            
        y: 0,                
        vy: 0,               
        isJumping: false,
        width: 36,
        height: 60,
        runCycle: 0         // Tracks current cycle frame for the procedural animation
    };

    let obstacles = [];
    let collectibles = [];
    let obstacleSpawnTimer = 0;
    let coinSpawnPatternTimer = 0;

    // Input Management
    window.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        
        if (e.key === 'ArrowLeft' && player.targetLaneIndex > 0) {
            player.targetLaneIndex--;
        }
        if (e.key === 'ArrowRight' && player.targetLaneIndex < LANES.length - 1) {
            player.targetLaneIndex++;
        }
        if (e.key === 'ArrowUp' && !player.isJumping) {
            player.vy = 11.5; 
            player.isJumping = true;
        }
    });

    // Synthesized Sound Effects Engine
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playCoinSound() {
        if (!audioCtx) return;
        // Fast, happy arpeggio syntax for retro-modern collection sound
        let now = audioCtx.currentTime;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5
        osc.frequency.setValueAtTime(880, now + 0.08); // A5
        
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.25);
    }

    function setupAndStart() {
        initAudio();
        
        // Clear UI panels
        startScreen.classList.remove('active');
        gameOverScreen.classList.remove('active');

        // Reset state values
        score = 0;
        coinsCollected = 0;
        speed = 5.5;
        obstacles = [];
        collectibles = [];
        obstacleSpawnTimer = 0;
        coinSpawnPatternTimer = 0;
        
        player.currentLaneIndex = 1;
        player.targetLaneIndex = 1;
        player.laneX = 0;
        player.y = 0;
        player.vy = 0;
        player.isJumping = false;
        player.runCycle = 0;

        coinBoard.innerText = `🪙 ${coinsCollected}`;
        gameActive = true;
        
        requestAnimationFrame(gameUpdate);
    }

    function triggerGameOver() {
        gameActive = false;
        finalScoreText.innerText = `Final Score: ${Math.floor(score)}`;
        finalCoinsText.innerText = `Coins Collected: 🪙 ${coinsCollected}`;
        gameOverScreen.classList.add('active');
    }

    // Pseudo-3D Perspective Projection Utility
    function project(laneOffset, zProgress) {
        let y = HORIZON_Y + zProgress * (canvas.height - HORIZON_Y);
        let currentTrackWidth = zProgress * TRACK_BASE_WIDTH;
        let laneWidth = currentTrackWidth / 3;
        let x = (canvas.width / 2) + (laneOffset * laneWidth);
        return { x, y, scale: zProgress };
    }

    function gameUpdate() {
        if (!gameActive) return;

        // --- Logic Calculations ---
        score += 0.15;
        scoreBoard.innerText = `SCORE: ${Math.floor(score)}`;
        
        // Progressive difficulty
        speed = Math.min(maxSpeed, 5.5 + Math.floor(score / 250));

        // Smoother, organic lane movement using linear interpolation adjustments
        player.laneX += (LANES[player.targetLaneIndex] - player.laneX) * 0.18;

        // Player Running Animation Calculations
        if (!player.isJumping) {
            player.runCycle += speed * 0.04; 
        } else {
            player.runCycle = 0.25; // Locked to mid-air profile frame
            player.y += player.vy;
            player.vy -= GRAVITY;
            if (player.y <= 0) {
                player.y = 0;
                player.vy = 0;
                player.isJumping = false;
            }
        }

        // --- Spawning Timers ---
        obstacleSpawnTimer++;
        if (obstacleSpawnTimer > Math.max(35, 90 - speed * 4)) {
            obstacleSpawnTimer = 0;
            let targetLane = Math.floor(Math.random() * 3) - 1;
            let type = Math.random() > 0.45 ? 'barrier' : 'train';
            obstacles.push({ lane: targetLane, z: 0.01, type: type });
        }

        coinSpawnPatternTimer++;
        if (coinSpawnPatternTimer > 50) {
            coinSpawnPatternTimer = 0;
            let targetLane = Math.floor(Math.random() * 3) - 1;
            // Spawn consecutive sequences of coins in selected lane
            for (let i = 0; i < 4; i++) {
                collectibles.push({ lane: targetLane, z: -0.05 * i, collected: false });
            }
        }

        // --- Render Steps ---
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Environmental Backdrop
        ctx.fillStyle = '#74b9ff'; // Cartoon Sky
        ctx.fillRect(0, 0, canvas.width, HORIZON_Y);
        ctx.fillStyle = '#26af5a'; // Ground Field
        ctx.fillRect(0, HORIZON_Y, canvas.width, canvas.height - HORIZON_Y);

        // Track Bed Structure
        ctx.fillStyle = '#4b6584'; 
        ctx.beginPath();
        let bL = project(-1.5, 1);
        let bR = project(1.5, 1);
        ctx.moveTo(canvas.width / 2, HORIZON_Y);
        ctx.lineTo(bL.x, bL.y);
        ctx.lineTo(bR.x, bR.y);
        ctx.closePath();
        ctx.fill();

        // White Cartoon Track Boundary Lines
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 4;
        [-1.5, -0.5, 0.5, 1.5].forEach(div => {
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, HORIZON_Y);
            let end = project(div, 1);
            ctx.lineTo(end.x, end.y);
            ctx.stroke();
        });

        // 2. Render Coins
        for (let i = collectibles.length - 1; i >= 0; i--) {
            let coin = collectibles[i];
            coin.z += (speed * 0.003);

            if (coin.z > 1.1) {
                collectibles.splice(i, 1);
                continue;
            }
            if (coin.z < 0 || coin.collected) continue;

            let pPos = project(coin.lane, coin.z);
            let radius = 14 * pPos.scale;

            if (radius > 1) {
                // Outer gold 3D disk ring
                ctx.fillStyle = '#fffa65';
                ctx.strokeStyle = '#ff9f43';
                ctx.lineWidth = Math.max(1, 3 * pPos.scale);
                ctx.beginPath();
                ctx.arc(pPos.x, pPos.y - 20 * pPos.scale, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Shiny Inner Core detail
                ctx.fillStyle = '#fff200';
                ctx.beginPath();
                ctx.arc(pPos.x, pPos.y - 20 * pPos.scale, radius * 0.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // Coin Collision Check
            if (coin.z > 0.82 && coin.z < 0.96) {
                if (Math.abs(player.laneX - coin.lane) < 0.35 && player.y < 45) {
                    coin.collected = true;
                    coinsCollected++;
                    score += 50; // Bonus score injection per coin
                    coinBoard.innerText = `🪙 ${coinsCollected}`;
                    playCoinSound();
                }
            }
        }

        // 3. Render Obstacles (Trains and Barriers)
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.z += (speed * 0.003);

            if (obs.z > 1.1) {
                obstacles.splice(i, 1);
                continue;
            }

            let pBase = project(obs.lane, obs.z);
            
            if (obs.type === 'barrier') {
                // --- DESIGN: Playful Construction Barrier ---
                let w = 65 * pBase.scale;
                let h = 42 * pBase.scale;
                let x = pBase.x - w / 2;
                let y = pBase.y - h;

                // Ground Drop Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.2)';
                ctx.fillRect(x, pBase.y - 4, w, 8 * pBase.scale);

                // Orange side pillars
                ctx.fillStyle = '#ff7f50';
                ctx.fillRect(x, y, 8 * pBase.scale, h);
                ctx.fillRect(x + w - 8 * pBase.scale, y, 8 * pBase.scale, h);

                // Main striped warning broadboard
                let boardH = 18 * pBase.scale;
                let boardY = y + 8 * pBase.scale;
                ctx.fillStyle = '#fff';
                ctx.fillRect(x, boardY, w, boardH);

                // Red Diagonal warning hashes
                ctx.fillStyle = '#ff4757';
                ctx.save();
                ctx.beginPath();
                ctx.rect(x, boardY, w, boardH);
                ctx.clip();
                for (let hX = -20; hX < w + 20; hX += 16 * pBase.scale) {
                    ctx.beginPath();
                    ctx.moveTo(x + hX, boardY);
                    ctx.lineTo(x + hX + 10 * pBase.scale, boardY);
                    ctx.lineTo(x + hX, boardY + boardH);
                    ctx.lineTo(x + hX - 10 * pBase.scale, boardY + boardH);
                    ctx.fill();
                }
                ctx.restore();

                // Top blinking neon-yellow utility light
                let lightOn = Math.floor(Date.now() / 200) % 2 === 0;
                ctx.fillStyle = lightOn ? '#fff200' : '#ccae00';
                ctx.beginPath();
                ctx.arc(pBase.x, y, 5 * pBase.scale, 0, Math.PI * 2);
                ctx.fill();

            } else if (obs.type === 'train') {
                // --- DESIGN: Modern Sub-Train Front Face ---
                let w = 90 * pBase.scale;
                let h = 130 * pBase.scale;
                let x = pBase.x - w / 2;
                let y = pBase.y - h;

                // Giant looming shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(x - 5, pBase.y - 10, w + 10, 20 * pBase.scale);

                // Main Rounded Metallic Train Frame Body (Silver/Yellow)
                ctx.fillStyle = '#dcdde1'; 
                ctx.beginPath();
                ctx.roundRect(x, y, w, h, [20 * pBase.scale, 20 * pBase.scale, 5, 5]);
                ctx.fill();

                // Vibrant Yellow styling panels
                ctx.fillStyle = '#eccc68';
                ctx.fillRect(x, y + h * 0.6, w, h * 0.25);

                // Big Sky Blue wind-shield
                ctx.fillStyle = '#70a1ff';
                ctx.strokeStyle = '#2f3542';
                ctx.lineWidth = Math.max(1, 3 * pBase.scale);
                ctx.beginPath();
                ctx.roundRect(x + w * 0.1, y + h * 0.1, w * 0.8, h * 0.35, [10 * pBase.scale]);
                ctx.fill();
                ctx.stroke();

                // Glowing circular head lamps
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 15 * pBase.scale;
                ctx.beginPath();
                ctx.arc(x + w * 0.2, y + h * 0.75, 8 * pBase.scale, 0, Math.PI * 2);
                ctx.arc(x + w * 0.8, y + h * 0.75, 8 * pBase.scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0; // Restore shadow configs immediately
            }

            // --- Collision Evaluation ---
            if (obs.z > 0.84 && obs.z < 0.98) {
                if (Math.abs(player.laneX - obs.lane) < 0.42) {
                    if (obs.type === 'barrier' && player.y < 35) {
                        triggerGameOver();
                        return;
                    } else if (obs.type === 'train') {
                        triggerGameOver();
                        return;
                    }
                }
            }
        }

        // 4. Render Player (Teenage Runner Profile)
        let pPlayer = project(player.laneX, 0.9);
        let pW = player.width;
        let pH = player.height;
        let pX = pPlayer.x - pW / 2;
        let pY = pPlayer.y - pH - player.y;

        // Oscillating running math parameters
        let leftFootForward = Math.sin(player.runCycle) > 0;
        let bounce = Math.abs(Math.sin(player.runCycle)) * 4;
        let adjustedPY = pY + (player.isJumping ? 0 : bounce);

        // Footwear & Legs
        ctx.fillStyle = '#ffffff'; // White Sneakers
        if (leftFootForward) {
            ctx.fillRect(pX + 2, adjustedPY + pH - 6, 12, 8); // Planted flat
            ctx.fillRect(pX + pW - 12, adjustedPY + pH - 12, 12, 8); // Floating air step
        } else {
            ctx.fillRect(pX + 2, adjustedPY + pH - 12, 12, 8);
            ctx.fillRect(pX + pW - 12, adjustedPY + pH - 6, 12, 8);
        }

        ctx.fillStyle = '#2f3542'; // Classic Blue Jeans layout
        ctx.fillRect(pX + 4, adjustedPY + pH - 22, pW - 8, 16);

        // Backpack accessory
        ctx.fillStyle = '#747d8c'; 
        ctx.roundRect(pX - 4, adjustedPY + 18, pW + 8, 20, 4);
        ctx.fill();

        // Red Hoodie Torso Segment
        ctx.fillStyle = '#ff4757';
        ctx.beginPath();
        ctx.roundRect(pX, adjustedPY + 14, pW, 26, [8, 8, 2, 2]);
        ctx.fill();

        // Pumping Animated Arms
        ctx.fillStyle = '#ff4757';
        if (leftFootForward) {
            ctx.fillRect(pX - 5, adjustedPY + 16, 6, 14); // Arm 1 high
            ctx.fillRect(pX + pW - 1, adjustedPY + 22, 6, 14); // Arm 2 trailing back
        } else {
            ctx.fillRect(pX - 5, adjustedPY + 22, 6, 14);
            ctx.fillRect(pX + pW - 1, adjustedPY + 16, 6, 14);
        }

        // Cartoon Head, Short Brown Hair & Cheerful Expression details
        ctx.fillStyle = '#ffdbac'; // Skin Tone
        ctx.beginPath();
        ctx.arc(pPlayer.x, adjustedPY + 6, 11, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#573719'; // Rich Brown Hair cap
        ctx.beginPath();
        ctx.arc(pPlayer.x, adjustedPY + 3, 12, Math.PI, 0);
        ctx.fill();

        // Cheerful Eyes & Smile vectors
        ctx.fillStyle = '#2f3542';
        ctx.beginPath();
        ctx.arc(pPlayer.x - 4, adjustedPY + 6, 1.5, 0, Math.PI * 2); // Eye L
        ctx.arc(pPlayer.x + 4, adjustedPY + 6, 1.5, 0, Math.PI * 2); // Eye R
        ctx.stroke();
        
        ctx.strokeStyle = '#ff4757';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(pPlayer.x, adjustedPY + 9, 4, 0, Math.PI); // Cheerful wide mouth curve
        ctx.stroke();

        requestAnimationFrame(gameUpdate);
    }
</script>
</body>
</html>

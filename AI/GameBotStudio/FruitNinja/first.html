<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja - Canvas Edition</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a120b;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            background: radial-gradient(circle, #3e2723 0%, #1a0f0d 100%);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        #strikes {
            color: #ff3333;
            letter-spacing: 5px;
        }
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #game-over-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #game-over-screen h1 {
            font-size: 60px;
            color: #ff3333;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,51,51,0.5);
        }
        #game-over-screen p {
            font-size: 24px;
            margin-bottom: 30px;
        }
        #restart-btn {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #e65100;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background 0.2s;
        }
        #restart-btn:hover {
            background-color: #ff6d00;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="score-display">SCORE: 0</div>
        <div id="strikes"></div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p id="final-score">Final Score: 0</p>
        <button id="restart-btn" onclick="resetGame()">Slice Again</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score-display');
        const strikesDisplay = document.getElementById('strikes');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreDisplay = document.getElementById('final-score');

        // Game Configuration & State
        let score = 0;
        let misses = 0;
        const maxMisses = 3;
        let isGameOver = false;
        
        let fruits = [];
        let particles = [];
        let bladeTrail = [];
        let lastSpawnTime = 0;
        const spawnInterval = 1000; // Spawn every 1 second
        const gravity = 0.25;

        // Fruit Definitions (Colors and configurations)
        const FRUIT_TYPES = [
            { name: 'watermelon', color: '#2e7d32', innerColor: '#d32f2f', radius: 45 },
            { name: 'orange', color: '#ef6c00', innerColor: '#ffe082', radius: 35 },
            { name: 'apple', color: '#c62828', innerColor: '#fff9c4', radius: 35 },
            { name: 'banana', color: '#fbc02d', innerColor: '#fffde7', radius: 25 },
            { name: 'coconut', color: '#4e342e', innerColor: '#ffffff', radius: 40 }
        ];

        // Mouse tracking state
        let isMouseDown = false;

        // Resize handler
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // --- Classes ---

        class Fruit {
            constructor() {
                const type = FRUIT_TYPES[Math.floor(Math.random() * FRUIT_TYPES.length)];
                this.color = type.color;
                this.innerColor = type.innerColor;
                this.radius = type.radius;
                
                // Spawn randomly along the bottom layout
                this.x = Math.random() * (canvas.width * 0.6) + (canvas.width * 0.2);
                this.y = canvas.height + this.radius;
                
                // Calculate realistic upward trajectory arcs
                this.vx = (Math.random() - 0.5) * 8; 
                this.vy = -(Math.random() * 5 + 13); // Upward velocity
                
                this.sliced = false;
                this.halfOffset = 0;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += gravity; // Gravity pull down
                this.rotation += this.rotationSpeed;

                if (this.sliced) {
                    this.halfOffset += 3; // Push sliced halves apart
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);

                if (!this.sliced) {
                    // Draw Whole Fruit
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    
                    // Inner ring detail
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = this.innerColor;
                    ctx.fill();
                } else {
                    // Draw Sliced Left Half
                    ctx.save();
                    ctx.translate(-this.halfOffset, 0);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, Math.PI / 2, (Math.PI * 3) / 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.8, Math.PI / 2, (Math.PI * 3) / 2);
                    ctx.fillStyle = this.innerColor;
                    ctx.fill();
                    ctx.restore();

                    // Draw Sliced Right Half
                    ctx.save();
                    ctx.translate(this.halfOffset, 0);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, (Math.PI * 3) / 2, Math.PI / 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius * 0.8, (Math.PI * 3) / 2, Math.PI / 2);
                    ctx.fillStyle = this.innerColor;
                    ctx.fill();
                    ctx.restore();
                }

                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.radius = Math.random() * 4 + 2;
                this.vx = (Math.random() - 0.5) * 10;
                this.vy = (Math.random() - 0.5) * 10;
                this.alpha = 1;
                this.decay = Math.random() * 0.03 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += gravity * 0.5;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // --- Core Logic Functions ---

        function updateStrikesUI() {
            strikesDisplay.textContent = 'X'.repeat(misses) + 'O'.repeat(maxMisses - misses);
        }

        function createJuiceExplosion(fruit) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(fruit.x, fruit.y, fruit.innerColor));
            }
        }

        function checkSlices() {
            if (bladeTrail.length < 2) return;

            // Get last two tracked points of mouse/drag line
            const p1 = bladeTrail[bladeTrail.length - 2];
            const p2 = bladeTrail[bladeTrail.length - 1];

            for (let fruit of fruits) {
                if (fruit.sliced) continue;

                // Basic Circle-to-Line segment intersection math approximation
                const distToP1 = Math.hypot(fruit.x - p1.x, fruit.y - p1.y);
                const distToP2 = Math.hypot(fruit.x - p2.x, fruit.y - p2.y);
                const lineLength = Math.hypot(p2.x - p1.x, p2.y - p1.y);

                // If mouse moved fast enough across or right into the radius boundary
                if (distToP1 < fruit.radius || distToP2 < fruit.radius || (distToP1 + distToP2 < lineLength + fruit.radius * 0.5)) {
                    fruit.sliced = true;
                    // Apply a specific split trajectory
                    fruit.vx = (fruit.x - p2.x) * 0.2;
                    score++;
                    scoreDisplay.textContent = `SCORE: ${score}`;
                    createJuiceExplosion(fruit);
                }
            }
        }

        // --- Game Loops & Controls ---

        function spawnManager(timestamp) {
            if (timestamp - lastSpawnTime > spawnInterval) {
                fruits.push(new Fruit());
                lastSpawnTime = timestamp;
            }
        }

        function handleGameOver() {
            isGameOver = true;
            finalScoreDisplay.textContent = `Final Score: ${score}`;
            gameOverScreen.classList.add('visible');
        }

        function resetGame() {
            score = 0;
            misses = 0;
            fruits = [];
            particles = [];
            bladeTrail = [];
            isGameOver = false;
            scoreDisplay.textContent = `SCORE: ${score}`;
            updateStrikesUI();
            gameOverScreen.classList.remove('visible');
            requestAnimationFrame(gameLoop);
        }

        function gameLoop(timestamp) {
            if (isGameOver) return;

            // Clear Screen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Spawning
            spawnManager(timestamp);

            // 2. Manage Blade Trails
            if (bladeTrail.length > 0) {
                // Fade out oldest point entries
                bladeTrail.shift(); 
            }
            if (isMouseDown && bladeTrail.length > 1) {
                checkSlices();
            }

            // Draw Blade
            if (bladeTrail.length > 1) {
                ctx.beginPath();
                ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
                for (let i = 1; i < bladeTrail.length; i++) {
                    ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
                }
                ctx.strokeStyle = '#e0f7fa';
                ctx.lineWidth = 5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00e5ff';
                ctx.stroke();
                ctx.shadowBlur = 0; // Reset shadow
            }

            // 3. Process Juice/Slice Particle FX
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // 4. Process Fruits
            for (let i = fruits.length - 1; i >= 0; i--) {
                const f = fruits[i];
                f.update();
                f.draw();

                // Check if fruit fell below screen bottom
                if (f.y > canvas.height + f.radius + 20) {
                    // Only count as a strike/miss if it fell un-sliced
                    if (!f.sliced) {
                        misses++;
                        updateStrikesUI();
                        if (misses >= maxMisses) {
                            handleGameOver();
                        }
                    }
                    fruits.splice(i, 1);
                }
            }

            requestAnimationFrame(gameLoop);
        }

        // --- Event Listeners ---

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            // Works for both standard clicks and touch screens
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function trackPointerMove(e) {
            if (!isMouseDown && e.type !== 'touchmove') return;
            bladeTrail.push(getMousePos(e));
            // Keep length manageable to preserve quick slashing action
            if (bladeTrail.length > 8) bladeTrail.shift();
        }

        // Desktop Events
        window.addEventListener('mousedown', (e) => { isMouseDown = true; bladeTrail.push(getMousePos(e)); });
        window.addEventListener('mousemove', trackPointerMove);
        window.addEventListener('mouseup', () => { isMouseDown = false; });

        // Touchscreen Events
        window.addEventListener('touchstart', (e) => { bladeTrail.push(getMousePos(e)); });
        window.addEventListener('touchmove', trackPointerMove);
        window.addEventListener('touchend', () => { bladeTrail = []; });

        // Start initialized UI & Loop
        updateStrikesUI();
        requestAnimationFrame(gameLoop);

    </script>
</body>
</html>

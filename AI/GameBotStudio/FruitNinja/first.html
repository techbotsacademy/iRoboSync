<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mini Fruit Ninja</title>
<style>
html,body{margin:0;overflow:hidden;background:#1e293b;}
canvas{display:block;cursor:crosshair;}
</style>
</head>
<body>
<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

function resize(){
  canvas.width=innerWidth;
  canvas.height=innerHeight;
}
addEventListener("resize",resize);
resize();

let score=0;
let misses=0;
let gameOver=false;

const gravity=0.22;
const fruits=[];
const particles=[];

let mouse={x:0,y:0,px:0,py:0};

const colors=["red","orange","yellow","lime","cyan","magenta"];

class Fruit{
  constructor(){
    this.r=20+Math.random()*10;
    this.x=80+Math.random()*(canvas.width-160);
    this.y=canvas.height+this.r;
    this.vx=(Math.random()-0.5)*4;
    this.vy=-(10+Math.random()*5);
    this.color=colors[Math.floor(Math.random()*colors.length)];
    this.dead=false;
    this.sliced=false;
  }

  update(){
    this.vy+=gravity;
    this.x+=this.vx;
    this.y+=this.vy;

    // wall bounce
    if(this.x<this.r||this.x>canvas.width-this.r){
      this.vx*=-1;
      this.x=Math.max(this.r,Math.min(canvas.width-this.r,this.x));
    }

    // missed
    if(this.y-this.r>canvas.height && !this.sliced){
      this.dead=true;
      misses++;
      if(misses>=3) gameOver=true;
    }
  }

  draw(){
    ctx.fillStyle=this.color;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
    ctx.fill();
  }
}

// Fruit collision
function collide(){
  for(let i=0;i<fruits.length;i++){
    for(let j=i+1;j<fruits.length;j++){
      const a=fruits[i],b=fruits[j];
      if(a.dead||b.dead) continue;

      let dx=b.x-a.x;
      let dy=b.y-a.y;
      let d=Math.hypot(dx,dy);
      let min=a.r+b.r;

      if(d<min){
        let nx=dx/(d||1);
        let ny=dy/(d||1);
        let overlap=(min-d)/2;

        a.x-=nx*overlap;
        a.y-=ny*overlap;
        b.x+=nx*overlap;
        b.y+=ny*overlap;

        let tx=a.vx;
        let ty=a.vy;

        a.vx=b.vx*0.9;
        a.vy=b.vy*0.9;
        b.vx=tx*0.9;
        b.vy=ty*0.9;
      }
    }
  }
}

// Line-circle slice test
function intersectsLineCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1;
  const dy=y2-y1;
  const l2=dx*dx+dy*dy;
  if(l2===0) return false;
  let t=((cx-x1)*dx+(cy-y1)*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  const px=x1+t*dx;
  const py=y1+t*dy;
  return Math.hypot(px-cx,py-cy)<=r;
}

function sliceFruit(f){
  f.dead=true;
  f.sliced=true;
  score++;

  for(let i=0;i<12;i++){
    particles.push({
      x:f.x,
      y:f.y,
      vx:(Math.random()-0.5)*5,
      vy:(Math.random()-0.5)*5,
      life:30,
      color:f.color
    });
  }
}

canvas.onmousemove=e=>{
  mouse.px=mouse.x;
  mouse.py=mouse.y;
  mouse.x=e.clientX;
  mouse.y=e.clientY;

  if(gameOver) return;

  for(const f of fruits){
    if(!f.dead &&
      intersectsLineCircle(mouse.px,mouse.py,mouse.x,mouse.y,f.x,f.y,f.r)){
      sliceFruit(f);
    }
  }
};

setInterval(()=>{
  if(!gameOver) fruits.push(new Fruit());
},800);

window.onkeydown=e=>{
  if(e.code==="Space" && gameOver){
    fruits.length=0;
    particles.length=0;
    score=0;
    misses=0;
    gameOver=false;
  }
};

function drawTrail(){
  ctx.strokeStyle="white";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(mouse.px,mouse.py);
  ctx.lineTo(mouse.x,mouse.y);
  ctx.stroke();
}

function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(!gameOver){
    fruits.forEach(f=>f.update());
    collide();
  }

  fruits.forEach(f=>f.draw());

  for(let i=particles.length-1;i>=0;i--){
    let p=particles[i];
    p.x+=p.vx;
    p.y+=p.vy;
    p.vy+=0.1;
    p.life--;

    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,3,3);

    if(p.life<=0) particles.splice(i,1);
  }

  for(let i=fruits.length-1;i>=0;i--){
    if(fruits[i].dead) fruits.splice(i,1);
  }

  drawTrail();

  ctx.fillStyle="white";
  ctx.font="24px Arial";
  ctx.fillText("Score: "+score,20,35);
  ctx.fillText("Misses: "+misses+"/3",20,70);

  if(gameOver){
    ctx.fillStyle="rgba(0,0,0,.6)";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";
    ctx.textAlign="center";
    ctx.font="50px Arial";
    ctx.fillText("GAME OVER",canvas.width/2,canvas.height/2-20);
    ctx.font="28px Arial";
    ctx.fillText("Final Score: "+score,canvas.width/2,canvas.height/2+30);
    ctx.fillText("Press SPACE to Restart",canvas.width/2,canvas.height/2+80);
    ctx.textAlign="left";
  }

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>

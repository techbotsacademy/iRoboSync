<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football AI Analytics Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #08111d;
      color: white;
    }
    .app {
      display: flex;
      min-height: 100vh;
    }
    .sidebar {
      width: 220px;
      background: #0b1320;
      padding: 20px;
      border-right: 1px solid #1d2b3a;
    }
    .brand {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 30px;
    }
    .nav {
      display: grid;
      gap: 10px;
    }
    .nav a {
      color: #c7d2fe;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,0.02);
    }
    .main {
      flex: 1;
      padding: 30px;
    }
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }
    .stat {
      background: #101b2d;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 18px;
    }
    .workspace {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .panel {
      background: #101b2d;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 18px;
    }
    .video-box {
      width: 100%;
      min-height: 300px;
      border-radius: 12px;
      background: #070d17;
      border: 1px solid #23334d;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #a2b4c9;
      text-align: center;
      overflow: hidden;
    }
    video {
      width: 100%;
      max-height: 420px;
      display: block;
      background: black;
    }
    .controls {
      margin-top: 14px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: bold;
    }
    .start { background: #3b82f6; color: white; }
    .stop { background: #ef4444; color: white; }
    .reset { background: #334155; color: white; }
    @media (max-width: 768px) {
      .app { display: block; }
      .sidebar { width: 100%; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .workspace { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">⚽ Football AI</div>
      <nav class="nav">
        <a href="#">Dashboard</a>
        <a href="#">Video Analysis</a>
        <a href="#">Processing</a>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p>AI FOOTBALL ANALYTICS</p>
          <h2>Video Analysis Dashboard</h2>
        </div>
        <div>Development Mode</div>
      </header>

      <section class="stats">
        <div class="stat">
          <div>Processing Status</div>
          <h3>Ready</h3>
        </div>
        <div class="stat">
          <div>Video Time</div>
          <h3>00:00 / 00:00</h3>
        </div>
        <div class="stat">
          <div>FPS</div>
          <h3>0</h3>
        </div>
        <div class="stat">
          <div>Frame Count</div>
          <h3>0</h3>
        </div>
      </section>

      <section class="workspace">
        <div class="panel">
          <h3>Match Footage</h3>
          <div class="video-box" id="videoBox">
            <div>
              <div style="font-size:40px;">▶</div>
              <p>No video selected</p>
            </div>
          </div>

          <div class="controls">
            <input type="file" id="videoUpload" accept="video/*" />
            <button class="start">Start Processing</button>
            <button class="stop">Stop Processing</button>
            <button class="reset">Reset</button>
          </div>
        </div>

        <div class="panel">
          <h3>Processing Controls</h3>
          <p>Step 1: Basic Upload and Video Preview</p>
        </div>
      </section>
    </main>
  </div>

  <script>
    const upload = document.getElementById("videoUpload");
    const videoBox = document.getElementById("videoBox");

    upload.addEventListener("change", function (event) {
      const file = event.target.files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const video = document.createElement("video");
      video.src = url;
      video.controls = true;
      video.autoplay = false;

      videoBox.innerHTML = "";
      videoBox.appendChild(video);
    });
  </script>
</body>
</html>

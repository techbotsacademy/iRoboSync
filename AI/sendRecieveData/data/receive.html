<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>2. Send Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body{ background:#0b0f0e; color:#eaf3ee; font-family:monospace; display:flex; flex-direction:column; align-items:center; padding:20px; }
  input[type=text]{ background:#111714; border:1px solid #1f2a26; color:#eaf3ee; padding:8px 12px; border-radius:6px; font-family:monospace; width:220px; }
  button{ background:#111714; border:1px solid #4fe3a1; color:#4fe3a1; padding:8px 14px; border-radius:6px; cursor:pointer; font-family:monospace; }
  .stage{ position:relative; width:300px; aspect-ratio:4/3; border:1px solid #1f2a26; border-radius:8px; overflow:hidden; background:#000; margin:10px 0; }
  video, canvas.overlay{ position:absolute; top:0; left:0; width:100%; height:100%; transform:scaleX(-1); }
  .grid{ display:flex; gap:16px; margin-top:15px; flex-wrap:wrap; justify-content:center; }
  .card{ border:1px solid #1f2a26; padding:12px; border-radius:8px; background:#111714; text-align:center; width:200px; }
  .img-box{ width:100%; aspect-ratio:4/3; border:1px solid #1f2a26; border-radius:6px; background:#000 center/cover no-repeat; margin:8px 0; }
  #log{ margin-top:15px; width:min(450px, 90vw); border:1px solid #1f2a26; padding:10px; background:#080b0a; font-size:12px; color:#4fe3a1; border-radius:6px; min-height:35px; }
</style>
</head>
<body>

  <h2>2. Send Page</h2>
  <div>
    <input id="espIp" type="text" placeholder="ESP32 IP e.g. 10.113.188.152" />
    <button onclick="saveIp()">Save IP</button>
  </div>

  <div class="stage">
    <video id="video" playsinline autoplay muted></video>
    <canvas id="overlay" class="overlay"></canvas>
  </div>
  <div style="font-size:13px; color:#7f948b;">Show 🖐️ <b>OPEN PALM</b> to send to ESP32</div>

  <div class="grid">
    <!-- <div class="card">
      <h3 style="font-size:12px; margin:0;">1. Captured Photo</h3>
      <div id="dbImg" class="img-box"></div>
    </div> -->

    <div class="card">
      <h3 style="font-size:12px; margin:0;">2. ESP32 Received</h3>
      <div id="wifiImg" class="img-box"></div>
    </div>
  </div>

  <div id="log">Status: Initializing...</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');
const espIpInput = document.getElementById('espIp');
const dbImg = document.getElementById('dbImg');
const wifiImg = document.getElementById('wifiImg');
const logEl = document.getElementById('log');

espIpInput.value = localStorage.getItem('esp32ip') || '';
function saveIp(){ localStorage.setItem('esp32ip', espIpInput.value.trim()); log('IP Saved ✓'); }
function log(msg){ logEl.innerText = 'Status: ' + msg; }

let currentDataUrl = null;

function loadFromDB(){
  const req = indexedDB.open('GestureBridgeDB', 1);
  req.onsuccess = e => {
    const db = e.target.result;
    if (!db.objectStoreNames.contains('photos')) return;
    const tx = db.transaction('photos', 'readonly');
    const getReq = tx.objectStore('photos').get('latest_photo');
    getReq.onsuccess = () => {
      if(getReq.result) {
        currentDataUrl = getReq.result;
        dbImg.style.backgroundImage = `url(${currentDataUrl})`;
      }
    };
  };
}

function checkOpenPalm(lm) {
  const wrist = lm[0];
  let extended = 0;
  for (const tipIdx of [8, 12, 16, 20]) {
    if (Math.hypot(lm[tipIdx].x - wrist.x, lm[tipIdx].y - wrist.y) > 0.38) extended++;
  }
  return extended >= 3;
}

let isSending = false;
let lastSendTime = 0;

async function sendToESP32(){
  loadFromDB();
  if(!currentDataUrl){ log('No photo in DB! First capture photo in Tab 1 using ✊ FIST.'); return; }
  const ip = localStorage.getItem('esp32ip');
  if(!ip){ log('Please Enter & Save ESP32 IP Address!'); return; }

  try {
    isSending = true;
    log('Sending image to ESP32 over WiFi...');

    const res = await fetch(`http://${ip}/upload`, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: currentDataUrl
    });

    if(res.ok){
      log('Image Received by ESP32 ✓');
      wifiImg.style.backgroundImage = `url(${currentDataUrl})`;
    } else {
      log('ESP32 Status Error: ' + res.status);
    }
  } catch(e) {
    log('Network Error: ' + e.message);
  } finally {
    setTimeout(() => { isSending = false; }, 3000);
  }
}

const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });
hands.onResults(results => {
  overlay.width = video.videoWidth; overlay.height = video.videoHeight;
  octx.clearRect(0, 0, overlay.width, overlay.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length) {
    const lm = results.multiHandLandmarks[0];
    if (checkOpenPalm(lm) && !isSending && (Date.now() - lastSendTime > 3000)) {
      lastSendTime = Date.now();
      sendToESP32();
    }
  }
});

const camera = new Camera(video, { onFrame: async () => await hands.send({image: video}), width: 320, height: 240 });
camera.start();
setInterval(loadFromDB, 1500);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>AI Fitness Tracker</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}


body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
color:white;
padding:20px;
}


.container{
width:100%;
max-width:900px;
}


.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.08);
border-radius:25px;
padding:30px;
box-shadow:0 0 40px rgba(0,0,0,0.4);
}


.title{
text-align:center;
font-size:32px;
font-weight:700;
margin-bottom:25px;
}


.title span{
color:#38bdf8;
}


.input-group{
display:flex;
gap:10px;
margin-bottom:25px;
}


input{
flex:1;
padding:14px;
border:none;
border-radius:12px;
font-size:16px;
outline:none;
}


button{
padding:14px 22px;
border:none;
border-radius:12px;
cursor:pointer;
font-size:16px;
font-weight:600;
}


.connect{
background:#38bdf8;
color:white;
}


.reset{
background:#ef4444;
color:white;
width:100%;
margin-top:20px;
}


.dashboard{
display:grid;
grid-template-columns:1fr 1fr;
gap:20px;
margin-top:20px;
}


.metric{
background:rgba(255,255,255,0.05);
padding:20px;
border-radius:18px;
text-align:center;
}


.metric h3{
font-size:15px;
opacity:0.8;
margin-bottom:10px;
}


.metric p{
font-size:34px;
font-weight:700;
}


.circle{
width:220px;
height:220px;
border-radius:50%;
margin:auto;
display:flex;
justify-content:center;
align-items:center;
background:conic-gradient(#38bdf8 0deg,#1f2937 0deg);
}


.inner{
width:180px;
height:180px;
border-radius:50%;
background:#0f172a;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}


.inner h2{
font-size:55px;
}


.status{
margin-top:8px;
color:#4ade80;
}


.footer{
text-align:center;
margin-top:15px;
opacity:0.7;
}


@media(max-width:700px){


.dashboard{
grid-template-columns:1fr;
}


.circle{
width:180px;
height:180px;
}


.inner{
width:145px;
height:145px;
}


.inner h2{
font-size:40px;
}


}


</style>
</head>
<body>


<div class="container">


<div class="card">


<div class="title">
AI <span>Fitness Tracker</span>
</div>


<div class="input-group">
<input id="ip" value="192.168.4.1">
<button class="connect" onclick="connectESP32()">
Connect
</button>
</div>


<div class="circle" id="progressCircle">


<div class="inner">
<h2 id="steps">0</h2>
<div>Steps</div>
<div class="status" id="status">
Disconnected
</div>
</div>


</div>


<div class="dashboard">


<div class="metric">
<h3>Distance</h3>
<p id="distance">0 m</p>
</div>


<div class="metric">
<h3>Calories</h3>
<p id="calories">0</p>
</div>


<div class="metric">
<h3>Walking State</h3>
<p id="walking">Idle</p>
</div>


<div class="metric">
<h3>Goal Progress</h3>
<p id="goal">0%</p>
</div>


</div>


<button class="reset" onclick="resetSteps()">
Reset Steps
</button>


<div class="footer">
Last Update:
<span id="time">--</span>
</div>


</div>


</div>


<script>


let esp32IP="";
let pollTimer=null;


const DAILY_GOAL=5000;


function connectESP32(){


esp32IP=document.getElementById("ip").value.trim();


if(!esp32IP){
alert("Enter ESP32 IP");
return;
}


document.getElementById("status").innerText="Connected";


if(pollTimer) clearInterval(pollTimer);


loadData();


pollTimer=setInterval(loadData,500);
}


async function loadData(){


try{


const response=
await fetch(`http://${esp32IP}/api/steps`);


const data=
await response.json();


const steps=data.steps || 0;


updateDashboard(steps);


document.getElementById("status").innerText="Connected";


}
catch(err){


document.getElementById("status").innerText="Connection Lost";


console.log(err);


}


}


function updateDashboard(steps){


document.getElementById("steps").innerText=steps;


const distance=(steps*0.75).toFixed(0);


document.getElementById("distance").innerText=
distance+" m";


const calories=(steps*0.04).toFixed(1);


document.getElementById("calories").innerText=
calories;


document.getElementById("walking").innerText=
steps>0 ? "Walking" : "Idle";


const percent=
Math.min((steps/DAILY_GOAL)*100,100);


document.getElementById("goal").innerText=
percent.toFixed(0)+"%";


const deg=(percent/100)*360;


document.getElementById("progressCircle").style.background=
`conic-gradient(
#38bdf8 ${deg}deg,
#1f2937 ${deg}deg
)`;


document.getElementById("time").innerText=
new Date().toLocaleTimeString();


}


async function resetSteps(){


if(!esp32IP) return;


try{


await fetch(`http://${esp32IP}/api/reset`);


updateDashboard(0);


}
catch(err){


console.log(err);


}


}


</script>


</body>
</html>

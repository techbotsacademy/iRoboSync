<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iRoboSync Playground</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    background:#f1f1f1;
}

/* Top Bar */

.topbar{
    background:#282A35;
    color:white;
    padding:10px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.title{
    font-size:22px;
    font-weight:bold;
}

button{
    background:#04AA6D;
    color:white;
    border:none;
    padding:10px 24px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#059862;
}

/* Main */

.container{
    flex:1;
    display:flex;
    overflow:hidden;
}

.left{
    width:50%;
    display:flex;
    flex-direction:column;
    resize:horizontal;
    overflow:auto;
    border-right:4px solid #ccc;
    min-width:300px;
}

.right{
    flex:1;
    background:white;
}

.header{
    background:#E7E9EB;
    padding:10px;
    font-weight:bold;
}

textarea{
    flex:1;
    border:none;
    resize:none;
    outline:none;
    padding:15px;
    font-family:Consolas,monospace;
    font-size:15px;
    background:white;
}

iframe{
    width:100%;
    height:100%;
    border:none;
    background:white;
}
</style>

</head>
<body>

<div class="topbar">

<div class="title">
HTML Playground
</div>

<div>
<button onclick="runCode()">▶ Run Code</button>
</div>

</div>


<div class="container">

<div class="left">

<div class="header">
HTML Editor
</div>

<textarea id="code"><!DOCTYPE html>
<html>
<head>
<style>
body{
font-family:Arial;
background:#fafafa;
text-align:center;
padding:50px;
}
h1{
color:#04AA6D;
}
button{
padding:12px 20px;
font-size:18px;
}
</style>
</head>

<body>

<h1>Hello World!</h1>

<p>Edit this HTML and click Run.</p>

<button onclick="alert('Hello!')">
Click Me
</button>

</body>
</html></textarea>

</div>

<div class="right">

<div class="header">
Output
</div>

<iframe id="output"></iframe>

</div>

</div>

<script>

function runCode(){

const code=document.getElementById("code").value;

const iframe=document.getElementById("output");

iframe.srcdoc=code;

}

runCode();

document.getElementById("code").addEventListener("keydown",function(e){

if(e.ctrlKey && e.key==="Enter"){
runCode();
}

});

</script>

</body>
</html>

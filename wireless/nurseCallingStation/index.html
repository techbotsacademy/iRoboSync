<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Nurse Station</title>

<style>
{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eaf4ff;
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
}

header{
    width:100%;
    background:#1976d2;
    color:white;
    text-align:center;
    padding:25px;
    font-size:2.3rem;
    font-weight:bold;
    letter-spacing:1px;
}

.card{
    margin-top:40px;
    background:white;
    width:90%;
    max-width:700px;
    border-radius:20px;
    padding:35px;
    box-shadow:0 8px 20px rgba(0,0,0,0.2);
    text-align:center;
}

.patient{
    font-size:2rem;
    font-weight:bold;
    color:#333;
    margin-bottom:30px;
}

/* Nurse Icon */
.icon{
    font-size:120px;
    transition:.5s;
}

/* Status Indicator */
.indicator{
    width:150px;
    height:150px;
    border-radius:50%;
    margin:30px auto;
    background:#1976d2;
    border:8px solid #444;
    transition:.5s;
}

.statusTitle{
    font-size:1.4rem;
    color:#555;
}

.status{
    font-size:2rem;
    font-weight:bold;
    margin-top:10px;
}

.message{
    margin-top:20px;
    font-size:1.3rem;
    color:#444;
    min-height:40px;
}

.notes{
    margin:40px;
    max-width:900px;
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 6px 15px rgba(0,0,0,.15);
}

.notes h2{
    color:#1976d2;
    margin-bottom:15px;
}

.notes li{
    margin:10px 0;
    font-size:1.1rem;
}

@media(max-width:700px){

.icon{
    font-size:90px;
}

.indicator{
    width:110px;
    height:110px;
}

.status{
    font-size:1.6rem;
}

}
</style>
</head>

<body>

<header>Smart Nurse Station</header>

<div style="text-align:center;margin:20px;">

    <button onclick="connectESP32()"
            style="
                padding:15px 30px;
                font-size:18px;
                border-radius:10px;
                cursor:pointer;
            ">
        Connect to ESP32
    </button>

    <p id="connection"
       style="margin-top:15px;font-size:18px;">
        Not Connected
    </p>

</div>
<div class="card">

    <div class="patient">
        Patient #1
    </div>

    <!-- Nurse Icon -->
    <div id="icon" class="icon">
        👩‍⚕️
    </div>

    <!-- Status Indicator -->
    <div id="indicator" class="indicator"></div>

    <div class="statusTitle">
        Current Status
    </div>

    <div id="status" class="status">
        Waiting
    </div>

    <div id="message" class="message">
        Waiting for patient request.
    </div>

</div>

<div class="notes">

<h2>Educational Notes</h2>

<ul>
<li><b style="color:red;">Red</b> → Patient needs help.</li>
<li><b style="color:#1976d2;">Blue</b> → Nurse is attending the patient (or waiting for a request).</li>
<li><b style="color:green;">Green</b> → Patient request completed.</li>
</ul>

</div>

<script>

/* ===================================================
   SMART NURSE STATION
   JavaScript Functions

   These functions simulate messages arriving from
   the ESP32.

   Later they can be called when receiving data via:
   • WebSocket
   • MQTT
   • HTTP
   • Serial
=================================================== */

const indicator = document.getElementById("indicator");
const icon = document.getElementById("icon");
const status = document.getElementById("status");
const message = document.getElementById("message");


/* Utility function */
function setColor(color){
    indicator.style.background = color;
    icon.style.color = color;
}


/* =========================================
   ESP32 sends: CALL
========================================= */
function patientCall(){

    setColor("red");

    status.innerHTML = "Nurse Requested";

    message.innerHTML =
        "Patient has requested assistance.";

}


/* =========================================
   ESP32 sends: ATTENDING
========================================= */
function nurseAttending(){

    setColor("#1976d2");

    status.innerHTML = "Nurse Attending";

    message.innerHTML =
        "Nurse is attending the patient.";

}


/* =========================================
   ESP32 sends: DONE
========================================= */
function nurseDone(){

    setColor("green");

    status.innerHTML = "Patient Assisted";

    message.innerHTML =
        "Request completed.";

}


/* =========================================
   Initial State
========================================= */

setColor("#1976d2");

let esp32IP = localStorage.getItem("esp32IP") || "";
let socket;

function connectESP32() {

    const ip = prompt("Enter ESP32 IP Address:");

    if (!ip) return;

    socket = new WebSocket("ws://" + ip + ":81");

    socket.onopen = function() {

        document.getElementById("connection").innerHTML =
            "🟢 ESP32 Connected";

    };

    socket.onmessage = function(event) {

        const command = event.data.trim();

        console.log("ESP32:", command);

        if (command === "CALL") {
            patientCall();
        }

        else if (command === "ATTENDING") {
            nurseAttending();
        }

        else if (command === "DONE") {
            nurseDone();
        }
    };

    socket.onclose = function() {

        document.getElementById("connection").innerHTML =
            "🔴 ESP32 Disconnected";

    };

    socket.onerror = function() {

        document.getElementById("connection").innerHTML =
            "🔴 Connection Error";

    };
}
</script>
</body>
</html>

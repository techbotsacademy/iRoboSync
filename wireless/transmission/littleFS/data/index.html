<!DOCTYPE html>

    <title>ESP32 LED Control</title>

<body>

<h1>ESP32 LED Control</h1>

<button onclick="toggleLED()">Toggle LED</button>

<script>
function toggleLED() {
    fetch("/toggle")
        .then(response => response.text())
        .then(data => console.log(data));
}
</script>

<title>Voice BLE Dashboard</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Segoe UI, Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background:
            radial-gradient(circle at top, #1f4eff, #0d1b2a 40%, #050b16);

        color: white;
    }

    .card {
        width: 420px;

        background: rgba(255, 255, 255, .06);

        backdrop-filter: blur(18px);

        border: 1px solid rgba(255, 255, 255, .15);

        border-radius: 20px;

        padding: 35px;

        text-align: center;

        box-shadow: 0 0 40px rgba(0, 153, 255, .35);
    }

    h1 {
        font-size: 30px;
        margin-bottom: 8px;
        color: #4dd0ff;
    }

    h3 {
        font-weight: 400;
        color: #b6d8ff;
        margin-bottom: 30px;
    }

    button {
        width: 220px;

        padding: 14px;

        margin: 10px;

        border: none;

        border-radius: 50px;

        font-size: 16px;

        cursor: pointer;

        transition: .35s;

        color: white;
    }

    button:hover {
        transform: translateY(-3px);
        box-shadow: 0 0 20px rgba(0, 255, 255, .5);
    }

    .connect {
        background: linear-gradient(45deg, #0099ff, #00d4ff);
    }

    .disconnect {
        background: linear-gradient(45deg, #ff3d71, #ff5f5f);
    }

        margin-top: 25px;

        background: rgba(255, 255, 255, .08);

        display: inline-block;

    .connected {
        background: #00ff80;
        box-shadow: 0 0 15px #00ff80;
    }

    .disconnected {
        background: #ff3d3d;
        box-shadow: 0 0 15px red;
    }

    .loading {
        animation: pulse .8s infinite;
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: .5;
        }

        50% {
            transform: scale(1.4);
            opacity: 1;
        }

            transform: scale(1);
            opacity: .5;
        }
    }

    @keyframes pulseButton {
        0% {
            box-shadow: 0 0 5px #00ff80;
        }

        50% {
            box-shadow: 0 0 30px #00ff80;
        }

        100% {
            box-shadow: 0 0 5px #00ff80;

        margin-top: 25px;

<div class="card">

```
<h1>ESP32 Voice Controller</h1>

<h3>Bluetooth Low Energy + Voice</h3>

<button
    class="connect"
    id="connectBtn"
    onclick="connectBLE()">

</button>

    class="disconnect"
    id="disconnectBtn"
    onclick="disconnectBLE()"

</button>

        🎤
    </div>

    <div

        id="heardText">

    <div
        class="command"
        id="commandText">
        ---
    </div>

    <button
        class="voice"
        id="voiceBtn"
        onclick="startListening()"
        disabled>
        🎤 Start Listening
    </button>

</div>

<div class="status">

    <span
        class="dot disconnected"
        id="dot">
    </span>

    <span id="statusText">
        Disconnected
    </span>

</div>

<footer>
    Voice controlled BLE interface
</footer>

</div>

<script>

const SERVICE_UUID =
    "4fafc201-1fb5-459e-8fcc-c5c9c331914b";

const CHARACTERISTIC_UUID =
    "beb5483e-36e1-4688-b7f5-ea07361b26a8";


let device = null;
let server = null;
let characteristic = null;


/* Speech Recognition */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = false;

    recognition.lang = "en-US";

}


/* UI */

const statusText =
    document.getElementById("statusText");

const dot =
    document.getElementById("dot");

const heardText =
    document.getElementById("heardText");

const commandText =
    document.getElementById("commandText");

const voiceBtn =
    document.getElementById("voiceBtn");


function updateStatus(text, color) {

    statusText.innerHTML = text;

    dot.className = "dot " + color;

}


/* =========================
   BLE CONNECTION
   ========================= */

async function connectBLE() {

    try {

        updateStatus(
            "Searching Device...",
            "loading"
        );

        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        name: "ESP32_Web_Control"
                    }
                ],

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        device.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );


        server =
            await device.gatt.connect();


        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        characteristic =
            await service.getCharacteristic(
                CHARACTERISTIC_UUID
            );


        updateStatus(
            "Connected Successfully",
            "connected"
        );


        document.getElementById(
            "connectBtn"
        ).disabled = true;


        document.getElementById(
            "disconnectBtn"
        ).disabled = false;


        voiceBtn.disabled = false;


    }

    catch (err) {

        console.error(err);

        updateStatus(
            "Connection Failed",
            "disconnected"
        );

    }

}


/* =========================
   BLE DISCONNECT
   ========================= */

async function disconnectBLE() {

    if (device && device.gatt.connected) {

        device.gatt.disconnect();

    }

}


/* =========================
   BLE DISCONNECTED
   ========================= */

function onDisconnected() {

    updateStatus(
        "Disconnected",
        "disconnected"
    );


    document.getElementById(
        "connectBtn"
    ).disabled = false;


    document.getElementById(
        "disconnectBtn"
    ).disabled = true;


    voiceBtn.disabled = true;

}


/* =========================
   SEND BLE COMMAND
   ========================= */

async function sendCommand(command) {

    if (!characteristic) {

        alert(
            "Please connect to ESP32 first."
        );

        return;

    }


    try {

        const encoder =
            new TextEncoder();


        await characteristic.writeValue(
            encoder.encode(command)
        );


        console.log(
            "Command Sent:",
            command
        );


    }

    catch (err) {

        console.error(err);

        alert(
            "Failed to send command."
        );

    }

}


/* =========================
   START VOICE RECOGNITION
   ========================= */

function startListening() {

    if (!recognition) {

        alert(
            "Speech recognition is not supported in this browser."
        );

        return;

    }


    if (!characteristic) {

        alert(
            "Please connect to ESP32 first."
        );

        return;

    }


    heardText.innerText =
        "Listening...";


    commandText.innerText =
        "🎤";


    voiceBtn.innerText =
        "🔴 Listening...";


    voiceBtn.classList.add(
        "listening"
    );


    recognition.start();

}


/* =========================
   SPEECH RESULT
   ========================= */

if (recognition) {

    recognition.onresult =
        async function(event) {

            const transcript =
                event.results[0][0].transcript
                    .toLowerCase()
                    .trim();


            console.log(
                "Heard:",
                transcript
            );


            heardText.innerText =
                'Heard: "' +
                transcript +
                '"';


            /*
             * Detect ON
             */

            if (
                transcript.includes("on") ||
                transcript.includes("turn on") ||
                transcript.includes("switch on")
            ) {

                commandText.innerText =
                    "💡 ON";


                await sendCommand("1");

            }


            /*
             * Detect OFF
             */

            else if (
                transcript.includes("off") ||
                transcript.includes("turn off") ||
                transcript.includes("switch off")
            ) {

                commandText.innerText =
                    "🌙 OFF";


                await sendCommand("0");

            }


            /*
             * Unknown command
             */

            else {

                commandText.innerText =
                    "❓ Unknown command";

            }

        };


    recognition.onstart =
        function() {

            console.log(
                "Speech recognition started"
            );

        };


    recognition.onend =
        function() {

            voiceBtn.innerText =
                "🎤 Start Listening";


            voiceBtn.classList.remove(
                "listening"
            );

        };


    recognition.onerror =
        function(event) {

            console.error(
                "Speech recognition error:",
                event.error
            );


            heardText.innerText =
                "Could not understand speech";


            commandText.innerText =
                "❌";


            voiceBtn.innerText =
                "🎤 Start Listening";


            voiceBtn.classList.remove(
                "listening"
            );

        };

}
</script>
</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirDrop Sender</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    margin:25px;
}

button{
    padding:14px 22px;
    margin:8px;
    border:0;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

textarea{
    width:90%;
    max-width:800px;
    height:120px;
    margin:10px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
}

#status{
    margin:20px auto;
    width:90%;
    max-width:800px;
    padding:15px;
    background:#222;
    border-radius:10px;
}

#url{
    margin:20px auto;
    width:90%;
    max-width:800px;
    padding:15px;
    background:#222;
    border-radius:10px;
    word-break:break-all;
}
</style>

</head>

<body>

<h1>📤 AirDrop Sender</h1>

<div id="status">
    Creating connection...
</div>

<div id="url">
    Current URL:<br>
    <b id="currentURL"></b>
</div>

<h3>1. Send this Offer to Device B</h3>

<textarea id="offer" readonly></textarea>

<br>

<button onclick="createOffer()">
    CREATE OFFER
</button>

<button onclick="copyOffer()">
    COPY OFFER
</button>

<h3>2. Paste Device B Answer</h3>

<textarea id="answer"
          placeholder="Paste answer from Device B here">
</textarea>

<br>

<button onclick="setAnswer()">
    CONNECT
</button>

<script>

let peer;
let channel;


// =================================================
// CURRENT URL
// =================================================

document.getElementById("currentURL").innerText =
    window.location.href;


// =================================================
// CREATE PEER
// =================================================

function createPeer(){

    peer = new RTCPeerConnection({

        iceServers:[
            {
                urls:"stun:stun.l.google.com:19302"
            }
        ]

    });


    channel =
        peer.createDataChannel("airdrop");


    channel.onopen = () => {

        document.getElementById("status").innerText =
            "🟢 CONNECTED — Ready to transfer";

    };


    channel.onclose = () => {

        document.getElementById("status").innerText =
            "Connection closed";

    };


    peer.onicecandidate = () => {

        /*
         Wait until ICE gathering completes.
        */

        if(
            peer.iceGatheringState ===
            "complete"
        ){

            document.getElementById("offer").value =
                JSON.stringify(
                    peer.localDescription
                );

        }

    };

}


// =================================================
// CREATE OFFER
// =================================================

async function createOffer(){

    createPeer();


    const offer =
        await peer.createOffer();


    await peer.setLocalDescription(
        offer
    );


    document.getElementById("status").innerText =
        "Creating offer...";

}


// =================================================
// COPY OFFER
// =================================================

async function copyOffer(){

    const text =
        document.getElementById("offer").value;

    await navigator.clipboard.writeText(
        text
    );

    document.getElementById("status").innerText =
        "Offer copied";

}


// =================================================
// SET ANSWER
// =================================================

async function setAnswer(){

    try{

        const answer =
            JSON.parse(
                document.getElementById("answer").value
            );


        await peer.setRemoteDescription(
            answer
        );


        document.getElementById("status").innerText =
            "Connecting to Device B...";

    }

    catch(error){

        console.error(error);

        alert(
            "Invalid answer"
        );

    }

}


// =================================================
// SEND URL
// =================================================

function sendURL(){

    if(
        !channel ||
        channel.readyState !== "open"
    ){

        alert(
            "Devices are not connected yet."
        );

        return;

    }


    const url =
        window.location.href;


    channel.send(
        JSON.stringify({

            type:"URL_TRANSFER",

            url:url

        })
    );


    document.getElementById("status").innerText =
        "🚀 URL SENT";

}


// =================================================
// TEMPORARY TEST BUTTON
// =================================================

const testButton =
    document.createElement("button");

testButton.innerText =
    "✊ TEST GRAB";

testButton.onclick =
    sendURL;

document.body.appendChild(
    testButton
);

</script>

</body>
</html>

<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AirDrop Receiver</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    margin:25px;
}

button{
    padding:14px 22px;
    margin:8px;
    border:0;
    border-radius:10px;
    font-size:17px;
    cursor:pointer;
}

textarea{
    width:90%;
    max-width:800px;
    height:120px;
    margin:10px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:10px;
    padding:10px;
}

#status{
    margin:20px auto;
    width:90%;
    max-width:800px;
    padding:15px;
    background:#222;
    border-radius:10px;
}

</style>

</head>

<body>

<h1>📥 AirDrop Receiver</h1>

<div id="status">
    Waiting for Device A...
</div>

<h3>Paste Offer from Device A</h3>

<textarea id="offer"
          placeholder="Paste Device A offer here">
</textarea>

<br>

<button onclick="createAnswer()">
    CREATE ANSWER
</button>

<h3>Send this Answer back to Device A</h3>

<textarea id="answer" readonly></textarea>

<br>

<button onclick="copyAnswer()">
    COPY ANSWER
</button>

<script>

let peer;
let channel;


// =================================================
// CREATE ANSWER
// =================================================

async function createAnswer(){

    try{

        const offer =
            JSON.parse(
                document.getElementById("offer").value
            );


        peer =
            new RTCPeerConnection({

                iceServers:[
                    {
                        urls:
                        "stun:stun.l.google.com:19302"
                    }
                ]

            });


        peer.ondatachannel =
            event => {

                channel =
                    event.channel;


                channel.onopen =
                    () => {

                        document.getElementById(
                            "status"
                        ).innerText =
                            "🟢 CONNECTED — Waiting for URL";

                    };


                channel.onmessage =
                    event => {

                        const message =
                            JSON.parse(
                                event.data
                            );


                        if(
                            message.type ===
                            "URL_TRANSFER"
                        ){

                            receiveURL(
                                message.url
                            );

                        }

                    };

            };


        peer.onicecandidate =
            () => {

                if(
                    peer.iceGatheringState ===
                    "complete"
                ){

                    document.getElementById(
                        "answer"
                    ).value =
                        JSON.stringify(
                            peer.localDescription
                        );

                }

            };


        await peer.setRemoteDescription(
            offer
        );


        const answer =
            await peer.createAnswer();


        await peer.setLocalDescription(
            answer
        );


        document.getElementById(
            "status"
        ).innerText =
            "Answer created — send it to Device A";

    }

    catch(error){

        console.error(error);

        alert(
            "Invalid offer"
        );

    }

}


// =================================================
// COPY ANSWER
// =================================================

async function copyAnswer(){

    const text =
        document.getElementById(
            "answer"
        ).value;


    await navigator.clipboard.writeText(
        text
    );


    document.getElementById(
        "status"
    ).innerText =
        "Answer copied";

}


// =================================================
// RECEIVE URL
// =================================================

function receiveURL(url){

    document.getElementById(
        "status"
    ).innerText =
        "📥 URL RECEIVED";


    console.log(
        "Received URL:",
        url
    );


    /*
       Give the user a moment to see
       the transfer notification.
    */

    setTimeout(
        () => {

            window.location.href =
                url;

        },
        1000
    );

}

</script>

</body>
</html>
